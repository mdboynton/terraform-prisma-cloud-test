---
# ============================
# TEST CONFIG (tuan_test branch)
# ============================
# Minimal, non-production config for exercising the modules against a local test
# tenant. A single team with a tightly-scoped resource list and a fake account
# group. No service accounts, no members, no real account IDs or hostnames.

tuan-test:
  description: "Tuan test team - disposable RBAC smoke test. Managed by Terraform."
  account_groups:
    - name: "tuan-test-account-group"
      description: "Tuan test account group."
      account_ids: []
      non_onboarded_account_ids: []
  resource_lists:
    - name: "tuan-test-resource-list"
      description: "Tuan test resource list."
      compute_access_group:
        namespaces:
          - "tuan-test-*"
        clusters:
          - "tuan-test-*"
  # Compute-native Collection => "tuan-test-workloads".
  #
  # This is the collection to reference from config/compute-runtime-policies.yaml.
  # The two CSPM collections the team also gets cannot be used there:
  #   - "tuan-test-assets" (prismacloud_collection) is invisible to Compute
  #   - "tuan-test-resource-list - Access Group (RBAC)" is visible, but its
  #     spaces and parentheses are rejected by the runtime-policy API
  compute_collection:
    enabled: true
    clusters:
      - "hs-cluster-1"

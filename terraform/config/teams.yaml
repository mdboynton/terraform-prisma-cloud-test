---
# ============================
# CCRA
# ============================

ccra:
  description: "Community Care team role"
  role_name_suffix: "-readonly-role"
  role_description: "CCR Application team role"
  account_groups:
    - name: "ccra-dev-ag"
      account_ids: []
      non_onboarded_account_ids:
        - "439631198817"
  resource_lists:
    - name: "ccra-app-rl"
      description: "ccra application workload"
      compute_access_group:
        clusters:
          - "ccra*"
        namespaces:
          - "ccra*"
        images:
          - "ccra*"
        containers:
          - "ccra*"
        hosts:
          - "ccra*"
        labels:
          - "ccra*"
        app_id:
          - "ccra*"
        functions:
          - "ccra*"
        code_repos:
          - "ccra*"

# ============================
# CP&E
# ============================
# NOTE: the live role is named "cp&e-readonly-role" and the live resource list
# "cp&e-app-rl". The module derives names from team_name, which forbids "&"
# (validation: lowercase alphanumeric + hyphen). So the role name cannot be
# reproduced exactly; expect an in-place rename diff on the role.

#cpe:
cp\u0026e:
  description: "cp&e read only role"
  role_name_suffix: "-readonly-role"
  account_groups:
    - name: "cpe-dev-ag"
      description: "CP&E development environment accounts. Managed by Terraform."
      account_ids: []
      non_onboarded_account_ids: []
  resource_lists:
    - name: "cp&e-app-rl"
      description: "CP&E development environment resources. Managed by Terraform."
      compute_access_group:
        clusters:
          - "*"
        namespaces:
          - "*"
        images:
          - "*"
        containers:
          - "*"
        hosts:
          - "*"
        labels:
          - "*"
        app_id:
          - "*"
        functions:
          - "*"
        code_repos:
          - "*"


name: 2. Compute Runtime Policies

# LIST (read-only): dump rules, index by collection, resolve rules for named clusters.
# APPLY (gated): append an RBAC collection to an EXISTING rule. Never creates/redefines.
#
# Docs: .github/workflows/compute-runtime-policies/README.md
#
# Required secrets: PRISMACLOUD_API_URL, PRISMACLOUD_USERNAME,
#                   PRISMACLOUD_PASSWORD, PRISMA_COMPUTE_CONSOLE_URL

on:
  #pull_request:
  #  branches: [main, tuan_test, tuan_test_compute_policies]
  #  paths: &compute_paths
  #    - "terraform/*.tf"
  #    - "terraform/.terraform.lock.hcl"
  #    - "terraform/config/**"
  #    - "terraform/modules/compute-runtime-policies/**"
  #    - ".github/workflows/compute-runtime-policies.yml"
  #push:
  #  branches: [main, tuan_test, tuan_test_compute_policies]
  #  paths: *compute_paths
  workflow_dispatch:
    inputs:
      list_compute_runtime:
        description: "List runtime policy rules during the plan (read-only)"
        type: boolean
        default: true
      list_collection:
        description: "Optional: restrict the collection index to this one collection name"
        type: string
        default: ""
      list_clusters:
        description: "Comma-separated cluster names to resolve rules for. Leave EMPTY to skip cluster resolution entirely."
        type: string
        default: ""
      apply:
        description: "Apply collection associations after a successful plan (requires approval)"
        type: boolean
        default: false

concurrency:
  group: compute-runtime-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.13.3"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

  TF_VAR_prisma_cloud_api_url: ${{ secrets.PRISMACLOUD_API_URL }}
  TF_VAR_prisma_cloud_access_key: ${{ secrets.PRISMACLOUD_USERNAME }}
  TF_VAR_prisma_cloud_secret_key: ${{ secrets.PRISMACLOUD_PASSWORD }}
  TF_VAR_prisma_compute_console_url: ${{ secrets.PRISMA_COMPUTE_CONSOLE_URL }}

  TF_VAR_compute_runtime_list_enabled: ${{ github.event.inputs.list_compute_runtime || 'true' }}
  TF_VAR_compute_runtime_list_collection: ${{ github.event.inputs.list_collection || '' }}

  # No fallback: push/PR carry no dispatch inputs, so this resolves empty -> [] (skip).
  COMPUTE_LIST_CLUSTERS_CSV: ${{ github.event.inputs.list_clusters }}

  TF_VAR_tenant_inventory_enabled: "false"

  TF_TARGETS: "-target=module.compute_runtime_policies"

defaults:
  run:
    working-directory: terraform

jobs:
  plan:
    name: Plan (and list)
    runs-on: ubuntu-latest
    outputs:
      exitcode: ${{ steps.plan.outputs.exitcode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt (check)
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Encode list_clusters
        # jq -n --arg, not `jq -R`: an empty string has no input line, so -R emits
        # nothing rather than "[]", which Terraform would reject as an invalid list.
        run: |
          json="$(jq -n -c --arg csv "${COMPUTE_LIST_CLUSTERS_CSV}" \
            '$csv | split(",") | map(gsub("^\\s+|\\s+$";"")) | map(select(length>0))')"
          echo "TF_VAR_compute_runtime_list_clusters=${json}" >> "$GITHUB_ENV"
          if [ "$json" = "[]" ]; then
            echo "Clusters: (none) — cluster resolution SKIPPED for this run."
          else
            echo "Clusters: ${json}"
          fi

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        id: plan
        run: |
          set +e
          terraform plan -input=false -no-color ${TF_TARGETS} -out=tfplan
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Show plan (human-readable)
        if: always()
        run: terraform show -no-color tfplan || true

      - name: Association dry run (what the apply would actually change)
        # terraform plan can't show this - the write runs inside a null_resource
        # script. These outputs are the real preview against the LIVE policy.
        if: always()
        run: |
          plan_json="$(terraform show -json tfplan 2>/dev/null || echo '{}')"

          for k in compute_container_preview compute_host_preview; do
            echo "===== $k ====="
            printf '%s' "$plan_json" \
              | jq -e --arg k "$k" '.output_changes[$k].after' 2>/dev/null \
              || echo "(unavailable)"
          done

          printf '%s' "$plan_json" | jq -r '
            [ .output_changes.compute_container_preview.after,
              .output_changes.compute_host_preview.after ]
            | map(select(. != null))
            | .[] as $p
            | $p.associations[]?
            | if .status == "rule_not_found" then
                "::warning title=Runtime rule not found::No \($p.policy_kind) rule named \(.policy_rule_name) — the apply will change NOTHING for this entry and still succeed."
              elif .status == "collection_not_found" then
                "::warning title=Collection not found::Collection \(.add_collection) does not exist — the \($p.policy_kind) apply will be REJECTED (HTTP 400)."
              elif .status == "collection_invalid_name" then
                "::warning title=Collection name rejected by API::\(.add_collection) contains characters this endpoint forbids (allowed: A-Z a-z 0-9 _ - :). RBAC collections ending in \" - Access Group (RBAC)\" can never be used here. The \($p.policy_kind) apply will be REJECTED (HTTP 400)."
              elif .status == "collection_cluster_scoped_on_host" then
                "::warning title=Cluster-scoped collection on a HOST rule::Collection \(.add_collection) restricts clusters, which HOST runtime policies forbid (hosts are not cluster members). Use a collection whose clusters are [*], or attach this one to a CONTAINER rule instead. The host apply will be REJECTED (HTTP 400)."
              else empty end
          ' 2>/dev/null || true

      - name: Runtime policy listing
        if: always()
        run: |
          plan_json="$(terraform show -json tfplan 2>/dev/null || echo '{}')"
          show_output() {
            echo "===== $1 ====="
            printf '%s' "$plan_json" | jq -e --arg k "$1" '.output_changes[$k].after' 2>/dev/null || echo "(unavailable)"
          }
          show_output compute_container_rules_by_cluster
          show_output compute_host_rules_by_cluster
          show_output compute_container_rules_by_collection
          show_output compute_host_rules_by_collection

      - name: Upload plan artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: compute-runtime-tfplan
          path: terraform/tfplan
          retention-days: 5

      - name: Fail if plan errored
        if: steps.plan.outputs.exitcode == '1'
        run: exit 1

  apply:
    name: Apply (gated)
    needs: plan
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.apply == true
    environment:
      name: test-tenant
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Encode list_clusters
        run: |
          json="$(jq -n -c --arg csv "${COMPUTE_LIST_CLUSTERS_CSV}" \
            '$csv | split(",") | map(gsub("^\\s+|\\s+$";"")) | map(select(length>0))')"
          echo "TF_VAR_compute_runtime_list_clusters=${json}" >> "$GITHUB_ENV"

      - name: Terraform init
        run: terraform init -input=false

      - name: Preflight — refuse to apply an association that cannot succeed
        # Environment approval doesn't re-validate the dry run. Re-runs the
        # preview and stops before any write.
        run: |
          terraform plan -input=false -no-color ${TF_TARGETS} -out=tfplan >/dev/null
          plan_json="$(terraform show -json tfplan)"

          bad="$(printf '%s' "$plan_json" | jq -r '
            [ .output_changes.compute_container_preview.after,
              .output_changes.compute_host_preview.after ]
            | map(select(. != null))
            | .[] as $p
            | $p.associations[]?
            | select(.status | IN("rule_not_found","collection_not_found","collection_invalid_name","collection_cluster_scoped_on_host"))
            | "  [\($p.policy_kind)] rule=\(.policy_rule_name) collection=\(.add_collection) -> \(.status)"
          ')"

          if [ -n "$bad" ]; then
            echo "Refusing to apply. These associations cannot succeed:"
            echo "$bad"
            echo
            echo "add_collection must exist and match ^[A-Za-z0-9_:-]+\$ (no RBAC \" - Access Group (RBAC)\" names)."
            echo "Nothing was changed."
            exit 1
          fi

          echo "Preflight OK — every association is applyable."

      - name: Terraform apply
        run: terraform apply -input=false -no-color -auto-approve ${TF_TARGETS}

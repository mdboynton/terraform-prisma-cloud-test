name: 2. Compute Runtime Policies

# Two capabilities for Prisma Cloud Compute runtime policies (Container + Host):
#
#   LIST  (read-only) — dump the rules, index them by collection, and resolve
#                       which rules apply to named clusters.
#   APPLY (gated)     — append an RBAC collection to an EXISTING rule. It never
#                       creates or redefines policies; it only adds a collection
#                       to a matched rule, preserving what is already there.
#
# SCOPE: -target keeps this run to the compute module only, so RBAC resources
# don't appear in the diff and can't be changed from here.
#
# Docs: .github/workflows/compute-runtime-policies/README.md
#
# Required secrets: PRISMACLOUD_API_URL, PRISMACLOUD_USERNAME,
#                   PRISMACLOUD_PASSWORD, PRISMA_COMPUTE_CONSOLE_URL

# PATH FILTERS: a run is triggered only when a commit touches one of these
# paths. "terraform/*.tf" matters as much as the module directory itself —
# the root wires this module's inputs (main.tf) and declares its variables,
# so a root-only change can alter this plan without touching modules/.
# Docs-only changes (**.md) are deliberately excluded so README edits don't
# burn CI minutes.
on:
  pull_request:
    branches: [main, tuan_test, tuan_test_compute_policies]
    paths: &compute_paths
      - "terraform/*.tf"
      - "terraform/.terraform.lock.hcl"
      - "terraform/config/**"
      - "terraform/modules/compute-runtime-policies/**"
      - ".github/workflows/compute-runtime-policies.yml"
  push:
    branches: [main, tuan_test, tuan_test_compute_policies]
    paths: *compute_paths
  workflow_dispatch:
    inputs:
      list_compute_runtime:
        description: "List runtime policy rules during the plan (read-only)"
        type: boolean
        default: true
      list_collection:
        description: "Optional: restrict the collection index to this one collection name"
        type: string
        default: ""
      list_clusters:
        description: "Comma-separated cluster names to resolve rules for. Leave EMPTY to skip cluster resolution entirely."
        type: string
        default: ""
      apply:
        description: "Apply collection associations after a successful plan (requires approval)"
        type: boolean
        default: false

concurrency:
  group: compute-runtime-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.13.3"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

  TF_VAR_prisma_cloud_api_url: ${{ secrets.PRISMACLOUD_API_URL }}
  TF_VAR_prisma_cloud_access_key: ${{ secrets.PRISMACLOUD_USERNAME }}
  TF_VAR_prisma_cloud_secret_key: ${{ secrets.PRISMACLOUD_PASSWORD }}
  # The compute module authenticates to the Console directly and reuses the
  # CSPM access key / secret key above; it only needs the Console URL as well.
  TF_VAR_prisma_compute_console_url: ${{ secrets.PRISMA_COMPUTE_CONSOLE_URL }}

  # Listing defaults to on so a push surfaces the current rules.
  TF_VAR_compute_runtime_list_enabled: ${{ github.event.inputs.list_compute_runtime || 'true' }}
  TF_VAR_compute_runtime_list_collection: ${{ github.event.inputs.list_collection || '' }}

  # Consumed by the "Encode list_clusters" step, which converts it into the JSON
  # array a list(string) TF_VAR_ requires.
  #
  # NO DEFAULT FALLBACK ON PURPOSE. A `|| 'some,clusters'` here would silently
  # re-introduce clusters whenever the field is cleared, and push/PR events carry
  # no dispatch inputs at all — so this resolves to empty for them, which the
  # encode step turns into [] (cluster resolution skipped). Cluster resolution is
  # opt-in per run.
  COMPUTE_LIST_CLUSTERS_CSV: ${{ github.event.inputs.list_clusters }}

  # Tenant inventory is a separate, read-only workflow.
  TF_VAR_tenant_inventory_enabled: "false"

  TF_TARGETS: "-target=module.compute_runtime_policies"

defaults:
  run:
    working-directory: terraform

jobs:
  plan:
    name: Plan (and list)
    runs-on: ubuntu-latest
    outputs:
      exitcode: ${{ steps.plan.outputs.exitcode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt (check)
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Encode list_clusters
        # compute_runtime_list_clusters is list(string), and a TF_VAR_ for a list
        # type must be a JSON array. Convert the comma-separated input; empty
        # input yields [] (no cluster resolution).
        #
        # Uses `jq -n --arg` rather than piping into `jq -R`: with a completely
        # empty string there is no input line at all, so `jq -R` emits NOTHING
        # (not "[]"), which would set the TF_VAR_ to an empty string and make
        # Terraform reject it as an invalid list(string).
        run: |
          json="$(jq -n -c --arg csv "${COMPUTE_LIST_CLUSTERS_CSV}" \
            '$csv | split(",") | map(gsub("^\\s+|\\s+$";"")) | map(select(length>0))')"
          echo "TF_VAR_compute_runtime_list_clusters=${json}" >> "$GITHUB_ENV"
          if [ "$json" = "[]" ]; then
            echo "Clusters: (none) — cluster resolution SKIPPED for this run."
          else
            echo "Clusters: ${json}"
          fi

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        id: plan
        run: |
          set +e
          terraform plan -input=false -no-color ${TF_TARGETS} -out=tfplan
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Show plan (human-readable)
        if: always()
        run: terraform show -no-color tfplan || true

      - name: Association dry run (what the apply would actually change)
        # THE PLAN CANNOT SHOW THIS. The association write runs inside a
        # null_resource script, so `terraform plan` only ever reports
        # "N to add" for the bookkeeping resource — never the policy diff.
        # These two outputs are the real preview, computed against the LIVE
        # policy at plan time.
        #
        # `rule_not_found` is called out as a ::warning because it is the
        # dangerous case: the apply matches no rule, changes nothing, and
        # still exits 0 — a green run that silently did nothing.
        if: always()
        run: |
          plan_json="$(terraform show -json tfplan 2>/dev/null || echo '{}')"

          for k in compute_container_preview compute_host_preview; do
            echo "===== $k ====="
            printf '%s' "$plan_json" \
              | jq -e --arg k "$k" '.output_changes[$k].after' 2>/dev/null \
              || echo "(unavailable)"
          done

          # Surface rule_not_found as an annotation on the run itself.
          printf '%s' "$plan_json" | jq -r '
            [ .output_changes.compute_container_preview.after,
              .output_changes.compute_host_preview.after ]
            | map(select(. != null))
            | .[] as $p
            | $p.associations[]?
            | select(.status == "rule_not_found")
            | "::warning title=Runtime rule not found::No \($p.policy_kind) rule named \(.policy_rule_name) — the apply will change NOTHING for this entry and still succeed."
          ' 2>/dev/null || true

      - name: Runtime policy listing
        # `terraform output` reads STATE, which is empty on a plan-only run, so
        # the planned values are read from the plan file instead — every output
        # is carried under .output_changes.<name>.after.
        if: always()
        run: |
          plan_json="$(terraform show -json tfplan 2>/dev/null || echo '{}')"
          show_output() {
            echo "===== $1 ====="
            printf '%s' "$plan_json" | jq -e --arg k "$1" '.output_changes[$k].after' 2>/dev/null || echo "(unavailable)"
          }
          show_output compute_container_rules_by_cluster
          show_output compute_host_rules_by_cluster
          show_output compute_container_rules_by_collection
          show_output compute_host_rules_by_collection

      - name: Upload plan artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: compute-runtime-tfplan
          path: terraform/tfplan
          retention-days: 5

      - name: Fail if plan errored
        if: steps.plan.outputs.exitcode == '1'
        run: exit 1

  apply:
    name: Apply (gated)
    needs: plan
    runs-on: ubuntu-latest
    # Only a deliberate manual dispatch with apply=true writes anything.
    if: github.event_name == 'workflow_dispatch' && inputs.apply == true
    environment:
      name: test-tenant
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Encode list_clusters
        # See the note on the matching step in the plan job: `jq -n --arg` is
        # required so a fully empty value still yields [] rather than nothing.
        run: |
          json="$(jq -n -c --arg csv "${COMPUTE_LIST_CLUSTERS_CSV}" \
            '$csv | split(",") | map(gsub("^\\s+|\\s+$";"")) | map(select(length>0))')"
          echo "TF_VAR_compute_runtime_list_clusters=${json}" >> "$GITHUB_ENV"

      - name: Terraform init
        run: terraform init -input=false

      # The append is non-destructive and idempotent: an association that is
      # already present is a no-op, and existing collections on a rule are kept.
      - name: Terraform apply
        run: terraform apply -input=false -no-color -auto-approve ${TF_TARGETS}

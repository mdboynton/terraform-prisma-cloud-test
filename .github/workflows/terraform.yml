name: Terraform (Prisma Cloud RBAC)

# Reconciles the Prisma Cloud test tenant from terraform/config/teams.yaml.
#
# - Pull requests: init + validate + plan (read-only, no tenant writes on apply).
# - Manual dispatch / push to tuan_test: plan, then a gated apply that requires
#   approval via the `test-tenant` GitHub Environment.
#
# Required repository (or environment) secrets:
#   PRISMACLOUD_API_URL          e.g. api.prismacloud.io
#   PRISMACLOUD_USERNAME         access key UUID
#   PRISMACLOUD_PASSWORD         secret key
#   PRISMA_COMPUTE_CONSOLE_URL   e.g. https://us-east1.cloud.twistlock.com/us-2-...
#
# The PaloAltoNetworks/prismacloud provider reads the first three natively. The
# compute-runtime-policies module reuses the same access key / secret key and only
# needs the Compute Console URL in addition (fed as TF_VAR_prisma_compute_console_url).

on:
  pull_request:
    branches: [main, tuan_test, tuan_test_compute_policies]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [tuan_test, main, tuan_test_compute_policies]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      apply:
        description: "Run terraform apply after a successful plan"
        type: boolean
        default: false
      list_compute_runtime:
        description: "Enable the read-only compute runtime policy listing during plan"
        type: boolean
        default: true
      list_collection:
        description: "Optional: restrict the compute runtime listing to this collection name"
        type: string
        default: ""
      list_clusters:
        description: "Comma-separated cluster names to resolve rules for (Direction 3)"
        type: string
        default: "hs-cluster-1,hs-cluster-2"

# Serialize runs so concurrent plans/applies don't fight over the tenant/state.
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.13.3"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  # Provider auth. providers.tf explicitly sets url/username/password from these
  # TF variables, so a null variable would override the provider's own env-var
  # fallback. We therefore feed the secrets in as TF_VAR_* (Terraform reads these
  # into the matching variables automatically), which populates the provider args.
  TF_VAR_prisma_cloud_api_url: ${{ secrets.PRISMACLOUD_API_URL }}
  TF_VAR_prisma_cloud_access_key: ${{ secrets.PRISMACLOUD_USERNAME }}
  TF_VAR_prisma_cloud_secret_key: ${{ secrets.PRISMACLOUD_PASSWORD }}
  # Compute Console URL for the compute-runtime-policies module. The access key /
  # secret key are reused from the CSPM secrets above (same credentials).
  TF_VAR_prisma_compute_console_url: ${{ secrets.PRISMA_COMPUTE_CONSOLE_URL }}
  # Read-only compute runtime policy listing. Enabled by default so a push surfaces
  # the runtime rules (and per-cluster resolution) in the plan logs; a manual
  # dispatch can override list_compute_runtime to false.
  TF_VAR_compute_runtime_list_enabled: ${{ github.event.inputs.list_compute_runtime || 'true' }}
  TF_VAR_compute_runtime_list_collection: ${{ github.event.inputs.list_collection || '' }}
  # Comma-separated clusters to resolve (Direction 3). Consumed by the "Encode
  # compute list_clusters" step below, which converts it to the JSON array the
  # root list(string) variable requires and exports TF_VAR_compute_runtime_list_clusters.
  COMPUTE_LIST_CLUSTERS_CSV: ${{ github.event.inputs.list_clusters || 'hs-cluster-1,hs-cluster-2' }}

defaults:
  run:
    working-directory: terraform

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      exitcode: ${{ steps.plan.outputs.exitcode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt (check)
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Encode compute list_clusters
        # The root compute_runtime_list_clusters is list(string); a TF_VAR_ for a
        # list type must be a JSON array. Convert the comma-separated input into a
        # JSON array and export it as TF_VAR_compute_runtime_list_clusters. Empty
        # input yields [] (no cluster resolution).
        run: |
          csv="${COMPUTE_LIST_CLUSTERS_CSV}"
          json="$(printf '%s' "$csv" | jq -R -c 'split(",") | map(gsub("^\\s+|\\s+$";"")) | map(select(length>0))')"
          echo "TF_VAR_compute_runtime_list_clusters=${json}" >> "$GITHUB_ENV"
          echo "Resolved TF_VAR_compute_runtime_list_clusters=${json}"

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        id: plan
        run: |
          set +e
          terraform plan -input=false -no-color -out=tfplan
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Show plan (human-readable)
        if: always()
        run: terraform show -no-color tfplan || true

      - name: Compute runtime listing outputs
        # Surfaces the read-only compute runtime results in the run logs so they
        # can be viewed in GitHub. Non-fatal: never blocks the plan.
        if: always()
        run: |
          echo "===== compute_container_rules_by_cluster ====="
          terraform output -json compute_container_rules_by_cluster 2>/dev/null | jq '.' || echo "(unavailable)"
          echo "===== compute_host_rules_by_cluster ====="
          terraform output -json compute_host_rules_by_cluster 2>/dev/null | jq '.' || echo "(unavailable)"
          echo "===== compute_container_rules_by_collection ====="
          terraform output -json compute_container_rules_by_collection 2>/dev/null | jq '.' || echo "(unavailable)"
          echo "===== compute_host_rules_by_collection ====="
          terraform output -json compute_host_rules_by_collection 2>/dev/null | jq '.' || echo "(unavailable)"

      - name: Upload plan artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/tfplan
          retention-days: 5

      - name: Comment plan on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');
            let plan = '';
            try {
              plan = execSync('terraform show -no-color tfplan', { cwd: 'terraform' }).toString();
            } catch (e) {
              plan = 'Plan output unavailable (see job logs).';
            }
            const max = 60000;
            const body = [
              '#### Terraform Plan `${{ steps.plan.outputs.exitcode }}`',
              '',
              '<details><summary>Show Plan</summary>',
              '',
              '```terraform',
              plan.length > max ? plan.slice(0, max) + '\n... (truncated, see artifact/logs)' : plan,
              '```',
              '',
              '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail if plan errored
        if: steps.plan.outputs.exitcode == '1'
        run: exit 1

  apply:
    name: Apply (gated)
    needs: plan
    runs-on: ubuntu-latest
    # Apply ONLY via a deliberate manual dispatch with apply=true. Pushes and PRs
    # run plan only — nothing is applied automatically. This makes the "mine" repo
    # safe to push to routinely while keeping apply an intentional, gated action.
    if: github.event_name == 'workflow_dispatch' && inputs.apply == true
    # Requires a protected GitHub Environment named test-tenant with a required
    # reviewer — this is what gates the apply behind manual approval.
    environment:
      name: test-tenant
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        run: terraform init -input=false

      # No remote backend is configured, so state is local to THIS job. Planning
      # and applying in the same job keeps state consistent (a plan artifact from
      # the separate plan job would reference state this job doesn't have). We
      # therefore run a fresh apply here rather than applying a saved plan file.
      - name: Terraform apply
        # -parallelism=1 serializes creation so the dashboard Collection isn't
        # created in the same instant the Resource List auto-spawns its own
        # Collection (that race produced a transient "object already exists").
        run: terraform apply -input=false -no-color -auto-approve -parallelism=1

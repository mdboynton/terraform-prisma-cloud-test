name: 1. RBAC (teams)

# Reconciles per-team Prisma Cloud RBAC artifacts from
# terraform/config/teams.yaml — Account Groups, Resource Lists, Roles, optional
# Service Accounts and Alert Rules, bound to a shared Permission Group.
#
# Docs: .github/workflows/rbac/README.md
#
# Required secrets: PRISMACLOUD_API_URL, PRISMACLOUD_USERNAME, PRISMACLOUD_PASSWORD

on:
  #pull_request:
  #  branches: [main, tuan_test, tuan_test_compute_policies]
  #  paths: &rbac_paths
  #    - "terraform/*.tf"
  #    - "terraform/.terraform.lock.hcl"
  #    - "terraform/config/**"
  #    - "terraform/modules/rbac/**"
  #    - ".github/workflows/rbac.yml"
  #push:
  #  branches: [main, tuan_test, tuan_test_compute_policies]
  #  paths: *rbac_paths
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the RBAC changes after a successful plan (requires approval)"
        type: boolean
        default: false

concurrency:
  group: rbac-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.13.3"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

  TF_VAR_prisma_cloud_api_url: ${{ secrets.PRISMACLOUD_API_URL }}
  TF_VAR_prisma_cloud_access_key: ${{ secrets.PRISMACLOUD_USERNAME }}
  TF_VAR_prisma_cloud_secret_key: ${{ secrets.PRISMACLOUD_PASSWORD }}

  # Set even for teams without compute_collection.enabled - root always configures the provider.
  TF_VAR_prisma_compute_console_url: ${{ secrets.PRISMA_COMPUTE_CONSOLE_URL }}

  TF_VAR_compute_runtime_list_enabled: "false"
  TF_VAR_tenant_inventory_enabled: "false"

  TF_TARGETS: >-
    -target=prismacloud_permission_group.app_owner_readonly_singleton
    -target=module.prisma_cloud_rbac

defaults:
  run:
    working-directory: terraform

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      exitcode: ${{ steps.plan.outputs.exitcode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt (check)
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        id: plan
        run: |
          set +e
          terraform plan -input=false -no-color ${TF_TARGETS} -out=tfplan
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Show plan (human-readable)
        if: always()
        run: terraform show -no-color tfplan || true

      - name: Upload plan artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rbac-tfplan
          path: terraform/tfplan
          retention-days: 5

      - name: Comment plan on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            let plan = '';
            try {
              plan = execSync('terraform show -no-color tfplan', { cwd: 'terraform' }).toString();
            } catch (e) {
              plan = 'Plan output unavailable (see job logs).';
            }
            const max = 60000;
            const body = [
              '#### RBAC Terraform Plan `${{ steps.plan.outputs.exitcode }}`',
              '',
              '<details><summary>Show Plan</summary>',
              '',
              '```terraform',
              plan.length > max ? plan.slice(0, max) + '\n... (truncated, see artifact/logs)' : plan,
              '```',
              '',
              '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail if plan errored
        if: steps.plan.outputs.exitcode == '1'
        run: exit 1

  apply:
    name: Apply (gated)
    needs: plan
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.apply == true
    environment:
      name: test-tenant
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        run: terraform init -input=false

      # Re-plan + apply (no remote backend to reuse the plan job's state).
      # -parallelism=1: avoids a race where the dashboard Collection and the
      # Resource List's auto-spawned Collection collide ("object already exists").
      - name: Terraform apply
        run: terraform apply -input=false -no-color -auto-approve -parallelism=1 ${TF_TARGETS}

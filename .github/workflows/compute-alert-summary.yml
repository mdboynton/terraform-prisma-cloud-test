name: 7. Compute Alert Summary (read-only)

# Answers "how many runtime incidents and image vulnerabilities does this
# COMPUTE collection have?".
#
# THIS IS THE SIBLING OF WORKFLOW 6, NOT A REPLACEMENT.
#
# Prisma has two unrelated collection systems. Workflow 6 scopes CSPM alerts by a
# CSPM Collection, which it resolves to cloud accounts. The "<name> - Access
# Group (RBAC)" collections a Resource List spawns are COMPUTE objects that do
# not exist on the CSPM side at all (verified: 0 of 46 CSPM collections), and
# 2,056 of 2,186 Compute collections are accountIDs:["*"] - so for a tenant that
# onboards no cloud accounts, workflow 6 has nothing to scope by.
#
# The two report DIFFERENT OBJECTS and the numbers are NOT comparable. Never add
# a count from this workflow to one from workflow 6.
#
# READ-ONLY BY CONSTRUCTION. The compute-alert-summary module contains only
# Terraform `data` blocks - no `resource` blocks - so this workflow cannot change
# the tenant. There is deliberately no apply job and no environment gate.
#
# Docs: .github/workflows/compute-alert-summary/README.md
#
# Required repository secrets:
#   PRISMACLOUD_USERNAME, PRISMACLOUD_PASSWORD, PRISMACLOUD_COMPUTE_CONSOLE_URL

on:
  workflow_dispatch:
    inputs:
      collection_name:
        description: "COMPUTE collection name, exactly as it appears in the Compute console (case-sensitive, e.g. 'team-alpha-resource-list - Access Group (RBAC)')"
        type: string
        required: true
      max_images:
        # A choice, not free text: a typo like "100O" would only surface as a
        # Terraform variable-validation error partway through the run.
        description: "Max images to scan for the CVE severity rollup. Incident and image COUNTS are never capped by this."
        type: choice
        default: "1000"
        options:
          - "100"
          - "500"
          - "1000"
          - "2500"
          - "5000"

concurrency:
  group: compute-alert-summary-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TF_VERSION: "1.13.3"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

  # The Compute Console URL must include any path segment the tenant requires
  # (e.g. https://<region>.cloud.twistlock.com/<id>). Stripping it yields a
  # successful-looking auth call that returns an empty token.
  TF_VAR_prisma_compute_console_url: ${{ secrets.PRISMACLOUD_COMPUTE_CONSOLE_URL }}
  TF_VAR_prisma_cloud_access_key: ${{ secrets.PRISMACLOUD_USERNAME }}
  TF_VAR_prisma_cloud_secret_key: ${{ secrets.PRISMACLOUD_PASSWORD }}

  # The CSPM provider is still configured at the root, so it needs a URL even
  # though this workflow never calls it.
  TF_VAR_prisma_cloud_api_url: ${{ secrets.PRISMACLOUD_API_URL }}

  TF_VAR_compute_alert_summary_enabled: "true"
  TF_VAR_compute_alert_summary_collection_name: ${{ inputs.collection_name }}
  TF_VAR_compute_alert_summary_max_images: ${{ inputs.max_images }}

  # Everything else off: this workflow asks one question and should not pay for
  # unrelated API calls.
  TF_VAR_alert_summary_enabled: "false"
  TF_VAR_access_audit_enabled: "false"
  TF_VAR_tenant_inventory_enabled: "false"
  TF_VAR_compute_runtime_list_enabled: "false"

defaults:
  run:
    working-directory: terraform

jobs:
  summary:
    name: Count Compute findings for a collection
    runs-on: ubuntu-latest

    # The image rollup pages 100 at a time and each page is ~48 MB on the wire
    # before reduction, so a large collection on a slow tenant takes a while.
    # The slowest real run measured ~8s; 20 minutes is generous.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        run: terraform init -input=false

      - name: Read Compute finding counts
        id: plan
        # -target keeps this to the compute module, so no other module is
        # evaluated and no unrelated API calls are made.
        #
        # Output is teed to a file so the failure step below can quote the real
        # error on the summary page rather than leaving it in the raw log.
        run: |
          set -o pipefail
          terraform plan -input=false -no-color \
            -target=module.compute_alert_summary -out=tfplan 2>&1 | tee plan-output.txt

      - name: Render report
        # The collection name reaches bash as an ENVIRONMENT VARIABLE, never as
        # a `${{ }}` interpolation. Interpolation pastes the raw string into the
        # script before bash parses it, so a collection named `$(...)` or with a
        # backtick would execute - verified locally. `env:` passes it as data.
        env:
          COLLECTION_NAME: ${{ inputs.collection_name }}
        run: |
          # Reads the PLAN file, not state: state is empty on a plan-only run,
          # so `terraform output` would return nothing.
          plan_json="$(terraform show -json tfplan)"

          get() { printf '%s' "$plan_json" | jq -c --arg k "$1" '.output_changes[$k].after'; }

          status="$(get compute_alert_summary_status | jq -r .)"
          detail="$(get compute_alert_summary_status_detail | jq -r '. // ""')"
          summary="$(get compute_alert_summary)"

          # BRANCH ON status, NOT ON THE EXIT CODE.
          #
          # The module's `check` blocks emit warnings but do NOT fail the plan,
          # and `terraform show -json` omits the `checks` array from a plan file
          # entirely - so a warning is invisible to any caller trusting the exit
          # code. Both behaviours verified against the live tenant.
          #
          # `missing_credentials` and `disabled` mean we never looked. Rendering
          # zeros for those would imply "nothing found", which is a lie.
          if [ "$status" = "disabled" ] || [ "$status" = "missing_credentials" ]; then
            {
              echo "## Compute alert summary - no counts produced"
              echo
              echo "**Collection:** \`$COLLECTION_NAME\`"
              echo
              echo "**Status:** \`$status\`"
              echo
              echo "> $detail"
              echo
              echo "No counts were produced. **Do not read this as \"no findings\".**"
            } >> "$GITHUB_STEP_SUMMARY"

            # Tells the failure step to stay quiet: this case is already
            # explained above. Without the marker the run shows two stacked
            # failure blocks saying roughly the same thing.
            touch handled-failure.marker

            echo "::error title=Compute alert summary failed::$status - $detail"
            exit 1
          fi

          incidents=$(printf '%s' "$summary" | jq -r '.incidents')
          unacked=$(printf   '%s' "$summary" | jq -r '.incidents_unacked')
          images=$(printf    '%s' "$summary" | jq -r '.images')
          inc_tenant=$(printf '%s' "$summary" | jq -r '.incidents_tenant')
          img_tenant=$(printf '%s' "$summary" | jq -r '.images_tenant')
          scanned=$(printf   '%s' "$summary" | jq -r '.images_scanned')
          complete=$(printf  '%s' "$summary" | jq -r '.images_complete')
          stop=$(printf      '%s' "$summary" | jq -r '.images_stop_reason')

          crit=$(printf '%s' "$summary" | jq -r '.vuln_critical')
          high=$(printf '%s' "$summary" | jq -r '.vuln_high')
          med=$(printf  '%s' "$summary" | jq -r '.vuln_medium')
          low=$(printf  '%s' "$summary" | jq -r '.vuln_low')

          # Share of the tenant, so a bare number has context.
          inc_pct=$(awk -v t="$incidents" -v n="$inc_tenant" 'BEGIN { if (n > 0) printf "%.1f", (t / n) * 100; else print "0.0" }')

          {
            echo "## Compute alert summary"
            echo
            echo "**Collection:** \`$COLLECTION_NAME\`"
            echo
            echo "### Runtime incidents"
            echo
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| **Incidents in this collection** | **$incidents** |"
            echo "| Unacknowledged | $unacked |"
            echo "| Tenant-wide | $inc_tenant |"
            echo "| Share of tenant | ${inc_pct}% |"
            echo
            echo "### Image vulnerabilities"
            echo
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| **Images in this collection** | **$images** |"
            echo "| Tenant-wide | $img_tenant |"
            echo
            echo "| Severity | CVE instances |"
            echo "|---|---|"
            echo "| Critical | $crit |"
            echo "| High | $high |"
            echo "| Medium | $med |"
            echo "| Low | $low |"
            echo
            echo "> CVE instances, not affected images: one image with three critical CVEs counts as three."
          } >> "$GITHUB_STEP_SUMMARY"

          # A partial scan is reported prominently rather than tucked away: the
          # severity numbers above are a SAMPLE when this fires, and a reader who
          # misses that will under-report.
          if [ "$complete" != "true" ]; then
            {
              echo
              echo "> [!WARNING]"
              echo "> **Vulnerability totals are incomplete.** Summed from **$scanned of $images** images (stopped: \`$stop\`)."
              echo "> The severity counts above are a sample. Re-run with a higher \`max_images\` for complete figures."
              echo "> Incident and image counts are unaffected - those are server-side totals."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # The scoped counts equalling the tenant totals is what a silently
          # dropped filter looks like. It is legitimate for an all-selecting
          # collection, so it warns rather than fails - but it always says so.
          if [ "$status" = "tenant_wide_scope" ]; then
            {
              echo
              echo "> [!WARNING]"
              echo "> **This collection's counts equal the tenant-wide totals.**"
              echo "> $detail"
              echo "> Confirm the collection's scope before reading these as team-specific."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # Full result to the artifact, including the fields not rendered above.
          printf '%s' "$summary" | jq '.' > compute-alert-summary.json
          echo "===== artifact ====="
          # `wc -c` pads its output with spaces on some platforms; strip them so
          # the log line reads "bytes=379" rather than "bytes=     379".
          echo "bytes=$(wc -c < compute-alert-summary.json | tr -d ' ')"

      # Runs ONLY when something above failed. Every other step writes to the
      # summary page on the success path, so without this a failed run produces a
      # blank summary - a red X and nothing else.
      - name: Report failure
        if: failure()
        env:
          COLLECTION_NAME: ${{ inputs.collection_name }}
        run: |
          # The render step explains a disabled/uncredentialed run better than
          # this generic block can, and marks it handled.
          if [ -f handled-failure.marker ]; then
            echo "Failure already reported on the summary page."
            exit 0
          fi

          {
            echo "## Compute alert summary - run failed"
            echo
            echo "**Collection:** \`$COLLECTION_NAME\`"
            echo
            echo "No counts were produced. **Do not read any number in this run as"
            echo "this collection's finding count.**"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -f plan-output.txt ] && grep -q "Error:" plan-output.txt; then
            {
              echo "### What went wrong"
              echo

              # The actionable sentence for this module comes from the script,
              # and Terraform prints it as "Error Message:" roughly fourteen
              # lines below the "Error:" header - past any fixed -A window.
              # Verified: a context-only excerpt cut off immediately before
              # "no Compute collection named ... did you mean ...", which is
              # precisely the line the Common causes table tells people to
              # look for. Hoist it, then show the context underneath.
              script_msg="$(grep -m1 '^Error Message:' plan-output.txt || true)"
              if [ -n "$script_msg" ]; then
                echo "**${script_msg#Error Message: }**"
                echo
              fi

              echo '```'
              grep -m1 -A8 "Error:" plan-output.txt
              echo '```'
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "The failure happened before or outside the Terraform plan."
              echo "See the job log for details."
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          {
            echo "### Common causes"
            echo
            echo "| Symptom | Fix |"
            echo "|---|---|"
            echo "| \`no Compute collection named ...\` | The name must match the Compute console exactly. The filter is **case-sensitive** - the error suggests the correct casing when it can find one. |"
            echo "| \`did you mean ...\` | Copy the suggested name verbatim. |"
            echo "| \`authentication returned no token\` | \`PRISMACLOUD_COMPUTE_CONSOLE_URL\` must include the path segment (e.g. \`/us-2-158320372\`), not just the hostname. |"
            echo "| Authentication errors | The \`PRISMACLOUD_*\` repository secrets may be missing or expired. |"
            echo "| Timed out | Lower \`max_images\`, or re-run if the tenant is rate limiting. |"
            echo "| Looking for a CSPM Collection? | This workflow reads **Compute** collections. Use workflow 6 for CSPM Collections - they are different objects. |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        # NOT always(): the artifact is written by the render step, so on an
        # earlier failure the path does not exist and upload-artifact prints
        # "No files were found" - a spurious warning stacked on the real error.
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: compute-alert-summary
          path: terraform/compute-alert-summary.json
          if-no-files-found: error
          retention-days: 30

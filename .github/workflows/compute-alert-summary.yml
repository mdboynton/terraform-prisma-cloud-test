name: 7. Compute Alert Summary (read-only)

# Runtime incidents + image vulnerabilities for a COMPUTE collection.
# Sibling of workflow 6 (CSPM collections) - different objects, don't add counts.
#
# Read-only: module has data blocks only. No apply job, no environment gate.
#
# Docs: .github/workflows/compute-alert-summary/README.md
#
# Required repository secrets:
#   PRISMACLOUD_USERNAME, PRISMACLOUD_PASSWORD, PRISMA_COMPUTE_CONSOLE_URL

on:
  workflow_dispatch:
    inputs:
      collection_name:
        description: "COMPUTE collection name, exactly as it appears in the Compute console (case-sensitive, e.g. 'team-alpha-resource-list - Access Group (RBAC)')"
        type: string
        required: true
      max_images:
        description: "Max images to scan for the CVE severity rollup. Incident and image COUNTS are never capped by this."
        type: choice
        default: "1000"
        options:
          - "100"
          - "500"
          - "1000"
          - "2500"
          - "5000"

concurrency:
  group: compute-alert-summary-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TF_VERSION: "1.13.3"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

  # Must include any path segment the tenant requires - stripped, auth "succeeds" with an empty token.
  TF_VAR_prisma_compute_console_url: ${{ secrets.PRISMA_COMPUTE_CONSOLE_URL }}
  TF_VAR_prisma_cloud_access_key: ${{ secrets.PRISMACLOUD_USERNAME }}
  TF_VAR_prisma_cloud_secret_key: ${{ secrets.PRISMACLOUD_PASSWORD }}
  TF_VAR_prisma_cloud_api_url: ${{ secrets.PRISMACLOUD_API_URL }}

  TF_VAR_compute_alert_summary_enabled: "true"
  TF_VAR_compute_alert_summary_collection_name: ${{ inputs.collection_name }}
  TF_VAR_compute_alert_summary_max_images: ${{ inputs.max_images }}

  TF_VAR_alert_summary_enabled: "false"
  TF_VAR_access_audit_enabled: "false"
  TF_VAR_tenant_inventory_enabled: "false"
  TF_VAR_compute_runtime_list_enabled: "false"

defaults:
  run:
    working-directory: terraform

jobs:
  summary:
    name: Count Compute findings for a collection
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        run: terraform init -input=false

      - name: Read Compute finding counts
        id: plan
        run: |
          set -o pipefail
          terraform plan -input=false -no-color \
            -target=module.compute_alert_summary -out=tfplan 2>&1 | tee plan-output.txt

      - name: Render report
        # env:, never ${{ }} interpolation - a collection named `$(...)` would execute.
        env:
          COLLECTION_NAME: ${{ inputs.collection_name }}
        run: |
          plan_json="$(terraform show -json tfplan)"

          get() { printf '%s' "$plan_json" | jq -c --arg k "$1" '.output_changes[$k].after'; }

          status="$(get compute_alert_summary_status | jq -r .)"
          detail="$(get compute_alert_summary_status_detail | jq -r '. // ""')"
          summary="$(get compute_alert_summary)"

          # Branch on status, not exit code - check-block warnings don't fail the plan.
          if [ "$status" = "disabled" ] || [ "$status" = "missing_credentials" ]; then
            {
              echo "## Compute alert summary - no counts produced"
              echo
              echo "**Collection:** \`$COLLECTION_NAME\`"
              echo
              echo "**Status:** \`$status\`"
              echo
              echo "> $detail"
              echo
              echo "No counts were produced. **Do not read this as \"no findings\".**"
            } >> "$GITHUB_STEP_SUMMARY"

            touch handled-failure.marker

            echo "::error title=Compute alert summary failed::$status - $detail"
            exit 1
          fi

          incidents=$(printf '%s' "$summary" | jq -r '.incidents')
          unacked=$(printf   '%s' "$summary" | jq -r '.incidents_unacked')
          images=$(printf    '%s' "$summary" | jq -r '.images')
          inc_tenant=$(printf '%s' "$summary" | jq -r '.incidents_tenant')
          img_tenant=$(printf '%s' "$summary" | jq -r '.images_tenant')
          scanned=$(printf   '%s' "$summary" | jq -r '.images_scanned')
          complete=$(printf  '%s' "$summary" | jq -r '.images_complete')
          stop=$(printf      '%s' "$summary" | jq -r '.images_stop_reason')

          crit=$(printf '%s' "$summary" | jq -r '.vuln_critical')
          high=$(printf '%s' "$summary" | jq -r '.vuln_high')
          med=$(printf  '%s' "$summary" | jq -r '.vuln_medium')
          low=$(printf  '%s' "$summary" | jq -r '.vuln_low')

          inc_pct=$(awk -v t="$incidents" -v n="$inc_tenant" 'BEGIN { if (n > 0) printf "%.1f", (t / n) * 100; else print "0.0" }')

          {
            echo "## Compute alert summary"
            echo
            echo "**Collection:** \`$COLLECTION_NAME\`"
            echo
            echo "### Runtime incidents"
            echo
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| **Incidents in this collection** | **$incidents** |"
            echo "| Unacknowledged | $unacked |"
            echo "| Tenant-wide | $inc_tenant |"
            echo "| Share of tenant | ${inc_pct}% |"
            echo
            echo "### Image vulnerabilities"
            echo
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| **Images in this collection** | **$images** |"
            echo "| Tenant-wide | $img_tenant |"
            echo
            echo "| Severity | CVE instances |"
            echo "|---|---|"
            echo "| Critical | $crit |"
            echo "| High | $high |"
            echo "| Medium | $med |"
            echo "| Low | $low |"
            echo
            echo "> CVE instances, not affected images: one image with three critical CVEs counts as three."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$complete" != "true" ]; then
            {
              echo
              echo "> [!WARNING]"
              echo "> **Vulnerability totals are incomplete.** Summed from **$scanned of $images** images (stopped: \`$stop\`)."
              echo "> The severity counts above are a sample. Re-run with a higher \`max_images\` for complete figures."
              echo "> Incident and image counts are unaffected - those are server-side totals."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$status" = "tenant_wide_scope" ]; then
            {
              echo
              echo "> [!WARNING]"
              echo "> **This collection's counts equal the tenant-wide totals.**"
              echo "> $detail"
              echo "> Confirm the collection's scope before reading these as team-specific."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          printf '%s' "$summary" | jq '.' > compute-alert-summary.json
          echo "===== artifact ====="
          echo "bytes=$(wc -c < compute-alert-summary.json | tr -d ' ')"

      - name: Report failure
        if: failure()
        env:
          COLLECTION_NAME: ${{ inputs.collection_name }}
        run: |
          if [ -f handled-failure.marker ]; then
            echo "Failure already reported on the summary page."
            exit 0
          fi

          {
            echo "## Compute alert summary - run failed"
            echo
            echo "**Collection:** \`$COLLECTION_NAME\`"
            echo
            echo "No counts were produced. **Do not read any number in this run as"
            echo "this collection's finding count.**"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -f plan-output.txt ] && grep -q "Error:" plan-output.txt; then
            {
              echo "### What went wrong"
              echo

              script_msg="$(grep -m1 '^Error Message:' plan-output.txt || true)"
              if [ -n "$script_msg" ]; then
                echo "**${script_msg#Error Message: }**"
                echo
              fi

              echo '```'
              grep -m1 -A8 "Error:" plan-output.txt
              echo '```'
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "The failure happened before or outside the Terraform plan."
              echo "See the job log for details."
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          {
            echo "### Common causes"
            echo
            echo "| Symptom | Fix |"
            echo "|---|---|"
            echo "| \`no Compute collection named ...\` | The name must match the Compute console exactly. The filter is **case-sensitive** - the error suggests the correct casing when it can find one. |"
            echo "| \`did you mean ...\` | Copy the suggested name verbatim. |"
            echo "| \`authentication returned no token\` | \`PRISMA_COMPUTE_CONSOLE_URL\` must include the path segment (e.g. \`/us-2-158320372\`), not just the hostname. |"
            echo "| Authentication errors | The \`PRISMACLOUD_*\` repository secrets may be missing or expired. |"
            echo "| Timed out | Lower \`max_images\`, or re-run if the tenant is rate limiting. |"
            echo "| Looking for a CSPM Collection? | This workflow reads **Compute** collections. Use workflow 6 for CSPM Collections - they are different objects. |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: compute-alert-summary
          path: terraform/compute-alert-summary.json
          if-no-files-found: error
          retention-days: 30

name: 9. Runtime Rule Effects (escalation)

# "Which firing rules are still only ALERTING?" - and, behind a manual gate,
# raises one to prevent/block. ONLY workflow that writes to a live runtime policy.
#
# Reads two APIs: CSPM alert carries no `effect` field at any depth (verified,
# 100 promoted alerts). Enforcement state lives only in Compute Console policy.
#
# Targets an EFFECT SITE, not a rule - container has 27, host 19. Escalation
# does not silence workflow 8 (effect != telemetry; a blocked action still incidents).
#
# Docs: .github/workflows/runtime-rule-effects/README.md
#
# Required repository secrets:
#   PRISMACLOUD_API_URL, PRISMACLOUD_USERNAME, PRISMACLOUD_PASSWORD,
#   PRISMA_COMPUTE_CONSOLE_URL

on:
  workflow_dispatch:
    inputs:
      window_days:
        description: "How far back to look for promoted runtime alerts. If a short window looks empty, the summary says how many exist overall."
        type: choice
        default: "14"
        options:
          - "7"
          - "14"
          - "30"
          - "90"
          - "180"
          - "365"
          - "730"
          - "1825"
      alert_status:
        description: "Which alert lifecycle state to report on. Rules whose alerts are all resolved are invisible under 'open'."
        type: choice
        default: "open"
        options:
          - "open"
          - "dismissed"
          - "resolved"
          - "snoozed"

      # Write path. Leave all four blank for a read-only run. Four separate
      # fields, not one JSON blob, so a dropdown can't be typo'd.
      escalate_kind:
        description: "ESCALATE: which policy the rule lives in. Leave blank for a read-only run."
        type: choice
        default: ""
        options:
          - ""
          - "container"
          - "host"
      escalate_rule:
        description: "ESCALATE: exact rule name, copied from the plan output."
        type: string
        default: ""
      escalate_site:
        description: "ESCALATE: the effect site path, copied VERBATIM from the plan (e.g. processes.deniedList.effect)."
        type: string
        default: ""
      escalate_effect:
        description: "ESCALATE: the new effect. `block` is container-only; a host rule must use `prevent`."
        type: choice
        default: ""
        options:
          - ""
          - "prevent"
          - "block"
      confirm:
        description: "ESCALATE: type APPLY (exactly, uppercase) to permit the write. Anything else keeps the run read-only."
        type: string
        default: ""

  # Read-only entry point for workflow 8's day-14 handoff. Enumerates sites
  # and stops - a human still picks one and types APPLY on a dispatch run.
  #
  # ⚠️ Write inputs are NOT declared here - a caller has no way to name a
  # rule/site/effect/confirm; that's the guarantee, not an editable condition.
  # `apply` job additionally refuses to run for `workflow_call` (see its `if:`).
  # Keeping the flip human-gated: plans/policy-escalation-findings.md,
  # "Workflow 9 must stay human-gated".
  workflow_call:
    inputs:
      window_days:
        description: "How far back to look for promoted runtime alerts."
        type: string
        required: false
        default: "14"
      alert_status:
        description: "Which alert lifecycle state to report on."
        type: string
        required: false
        default: "open"
    outputs:
      escalation_status:
        description: "Status reported by the plan. For a called run this is never will_apply."
        value: ${{ jobs.plan.outputs.escalation_status }}

concurrency:
  group: runtime-rule-effects-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TF_VERSION: "1.13.3"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

  TF_VAR_prisma_cloud_api_url: ${{ secrets.PRISMACLOUD_API_URL }}
  TF_VAR_prisma_cloud_access_key: ${{ secrets.PRISMACLOUD_USERNAME }}
  TF_VAR_prisma_cloud_secret_key: ${{ secrets.PRISMACLOUD_PASSWORD }}
  TF_VAR_prisma_compute_console_url: ${{ secrets.PRISMA_COMPUTE_CONSOLE_URL }}

  TF_VAR_runtime_rule_effects_enabled: "true"
  TF_VAR_runtime_rule_effects_window_days: ${{ inputs.window_days }}
  TF_VAR_runtime_rule_effects_alert_status: ${{ inputs.alert_status }}

  TF_VAR_tenant_inventory_enabled: "false"
  TF_VAR_runtime_grace_digest_enabled: "false"

  # Verified: without -target a confirmed run plans 4 resource changes; with it, 1.
  TF_TARGETS: "-target=module.runtime_rule_effects"

defaults:
  run:
    working-directory: terraform

jobs:
  plan:
    name: Plan (read-only)
    runs-on: ubuntu-latest
    outputs:
      escalation_status: ${{ steps.status.outputs.escalation_status }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt (check)
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Encode the requested escalation
        # Confirmation word passed through unchanged - accepting "apply"/"Apply" would
        # defeat requiring an exact typed string.
        run: |
          json="$(jq -n -c \
            --arg kind   "${{ inputs.escalate_kind }}" \
            --arg rule   "${{ inputs.escalate_rule }}" \
            --arg site   "${{ inputs.escalate_site }}" \
            --arg effect "${{ inputs.escalate_effect }}" '
              if ($kind|length) > 0 and ($rule|length) > 0
                 and ($site|length) > 0 and ($effect|length) > 0
              then [{kind:$kind, rule:$rule, site:$site, effect:$effect}]
              else [] end')"
          echo "TF_VAR_runtime_rule_effects_escalations=${json}" >> "$GITHUB_ENV"
          echo "Requested escalations: ${json}"

          # Half-filled = mistake, not read-only. Fail loud rather than silently
          # report "nothing_requested".
          filled=0
          for v in "${{ inputs.escalate_kind }}" "${{ inputs.escalate_rule }}" \
                   "${{ inputs.escalate_site }}" "${{ inputs.escalate_effect }}"; do
            [ -n "$v" ] && filled=$((filled+1))
          done
          if [ "$filled" -ne 0 ] && [ "$filled" -ne 4 ]; then
            echo "::error::$filled of 4 escalation fields were filled in. Provide all four, or none."
            exit 1
          fi

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform plan
        id: plan
        env:
          TF_VAR_runtime_rule_effects_apply: ${{ inputs.confirm }}
        run: |
          terraform plan -input=false -no-color ${TF_TARGETS} -out=tfplan
          terraform show -json tfplan > plan.json

      - name: Read the escalation status
        id: status
        run: |
          # ⚠️ DO NOT READ FROM `.planned_values.outputs` - BUG (run 32517954430):
          # -target makes the plan PARTIAL; Terraform prunes root outputs whose
          # deps sit outside the target graph, including escalation_status. The
          # resource itself is never pruned (it IS the target), so derive the
          # verdict from resource_changes and fall back to the output only when
          # the plan is complete.
          escalates="$(jq -r '[.resource_changes[]?
                       | select(.address | test("null_resource\\.escalate"))
                       | select(.change.actions != ["no-op"])] | length' plan.json)"

          out="$(jq -r '.planned_values.outputs.runtime_rule_effects_escalation_status.value // ""' plan.json)"

          # `.variables` is NOT pruned by -target, unlike outputs - readable on every run.
          # Run 32303297872: genuine read-only run, status output pruned too - absence
          # of a request is a readable answer, not an error.
          requested="$(jq -r '(.variables.runtime_rule_effects_escalations.value // []) | length' plan.json)"
          confirmed="$(jq -r '.variables.runtime_rule_effects_apply.value // ""' plan.json)"

          if [ "$escalates" -gt 0 ]; then
            s="will_apply"
          elif [ -n "$out" ]; then
            s="$out"
          elif [ "$requested" -eq 0 ]; then
            s="nothing_requested"
          elif [ "$confirmed" != "APPLY" ]; then
            s="not_confirmed"
          else
            # Impossible combination = the bug this step was rewritten to catch.
            # No silent "unknown" fallback - that's how an authorised escalation
            # went unnoticed before.
            echo "::error::Escalation requested ($requested target(s), confirm=$confirmed) but the plan shows no write and no readable status. Refusing to guess - inspect the runtime-rule-effects-plan artifact."
            exit 1
          fi

          echo "escalation_status=$s" >> "$GITHUB_OUTPUT"
          echo "escalation_status=$s (planned writes: $escalates, requested: $requested)"

      - name: Assert the plan changed nothing
        run: |
          n="$(jq '[.resource_changes[]? | select(.change.actions != ["no-op"])] | length' plan.json)"
          echo "Resources an apply would change: $n"
          jq -r '.resource_changes[]? | select(.change.actions != ["no-op"])
                 | "  \(.address): \(.change.actions|join(","))"' plan.json

          stray="$(jq -r '[.resource_changes[]?
                   | select(.change.actions != ["no-op"])
                   | select(.address | test("null_resource\\.escalate") | not)
                   | .address] | join(", ")' plan.json)"
          if [ -n "$stray" ]; then
            echo "::error::The plan would change resources outside this module: $stray"
            exit 1
          fi

      # Leads with the pending write, not the tenant read - the old layout
      # (tenant stats first) is how bug 3 hid: the verdict was empty underneath
      # a healthy-looking summary. Must not read escalation_* outputs (pruned
      # by -target) - uses .variables, alerting/disabled/enforced_sites, and
      # the status step output instead.
      - name: Render the summary
        env:
          STATUS: ${{ steps.status.outputs.escalation_status }}
        run: |
          {
            echo "## Runtime rule effects — pending write"
            echo

            req="$(jq -r '(.variables.runtime_rule_effects_escalations.value // []) | length' plan.json)"

            if [ "$req" -eq 0 ]; then
              echo "**Nothing is slated to be written.** This run only read the tenant."
              echo
              echo "To escalate a rule, re-run with the four \`escalate_*\` fields filled in."
            else
              # One row per requested target, joined against live state so the
              # change reads as a diff rather than an announcement. The join is
              # kind+rule+site, which is how the module identifies a site.
              echo "| kind | rule | site | now | would become |"
              echo "|---|---|---|---|---|"
              jq -r '
                ([ (.planned_values.outputs.runtime_rule_effects_alerting_sites.value // [])[],
                   (.planned_values.outputs.runtime_rule_effects_disabled_sites.value // [])[],
                   (.planned_values.outputs.runtime_rule_effects_enforced_sites.value // [])[]
                 ] | map({key: "\(.kind)|\(.rule)|\(.site)", value: .effect}) | from_entries) as $live
                | (.variables.runtime_rule_effects_escalations.value // [])[]
                | . as $e
                | ($live["\($e.kind)|\($e.rule)|\($e.site)"] // "not found") as $now
                | "| \($e.kind) | \($e.rule) | `\($e.site)` | `\($now)` | `\($e.effect)` |"
              ' plan.json
              echo

              # disable -> anything is NOT a tightening (switches a dormant
              # detection ON with no observation period; 58 sites sit at disable).
              # Bind $e before index() - `.` inside index() is the array, not the
              # element; a bare .kind there breaks jq under set -e.
              woke="$(jq -r '
                ([ (.planned_values.outputs.runtime_rule_effects_disabled_sites.value // [])[] ]
                 | map("\(.kind)|\(.rule)|\(.site)")) as $off
                | [ (.variables.runtime_rule_effects_escalations.value // [])[]
                    | . as $e
                    | select(($off | index("\($e.kind)|\($e.rule)|\($e.site)")) != null)
                    | "\($e.rule) / \($e.site)" ] | join(", ")
              ' plan.json)"
              if [ -n "$woke" ]; then
                echo "> [!WARNING]"
                echo "> **This turns a detection ON, it does not tighten one.**"
                echo ">"
                echo "> Currently \`disable\`: $woke"
                echo ">"
                echo "> These sites are not detecting anything today. Escalating"
                echo "> them enforces immediately, with no alerting period first."
                echo
              fi
            fi

            echo
            echo "**Verdict:** \`${STATUS:-unavailable}\`"
            echo
            case "${STATUS:-}" in
              will_apply)
                echo "An apply would write the change above. It is held at the"
                echo "environment approval — nothing has changed yet."
                ;;
              nothing_requested)
                echo "No escalation was requested, so the apply job is skipped."
                ;;
              not_confirmed)
                echo "A target was named but \`apply_confirm\` was not \`APPLY\`,"
                echo "so the apply job is skipped and nothing will be written."
                ;;
              disabled)
                echo "The module is disabled, so no write was planned."
                ;;
            esac
            echo

            echo "<details><summary>Tenant read (context)</summary>"
            echo
            status="$(jq -r '.planned_values.outputs.runtime_rule_effects_status.value // "unknown"' plan.json)"
            detail="$(jq -r '.planned_values.outputs.runtime_rule_effects_status_detail.value // ""' plan.json)"
            echo "Read status: \`$status\`"
            if [ -n "$detail" ] && [ "$detail" != "null" ]; then
              echo
              echo "> $detail"
            fi
            echo
            jq -r '.planned_values.outputs.runtime_rule_effects.value
                   | "sites \(.sites), matched \(.matched), alerting \(.alerting), enforced \(.enforced), disabled \(.disabled) (window \(.window_days)d)"' \
              plan.json 2>/dev/null || echo "_No summary available._"
            echo
            echo "The full per-site breakdown is in the \`runtime-rule-effects-plan\` artifact."
            echo "</details>"
            echo

            wstatus="$(jq -r '.planned_values.outputs.runtime_rule_effects_window_status.value // "unknown"' plan.json)"
            wdetail="$(jq -r '.planned_values.outputs.runtime_rule_effects_window_detail.value // ""' plan.json)"
            if [ "$wstatus" = "empty_window_but_alerts_exist" ]; then
              echo "> [!WARNING]"
              echo "> **The window is too narrow — this is not an all-clear.**"
              echo ">"
              echo "> $wdetail"
              echo
            elif [ "$wstatus" = "genuinely_empty" ]; then
              echo "> [!NOTE]"
              echo "> $wdetail"
              echo
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the plan
        uses: actions/upload-artifact@v4
        with:
          name: runtime-rule-effects-plan
          path: terraform/plan.json
          retention-days: 14

  apply:
    name: Apply the escalation (gated)
    needs: plan
    runs-on: ubuntu-latest
    # event-name check is a second, independent lock: even if workflow_call
    # later grows escalate_* inputs, this line still blocks an unattended write.
    if: >-
      needs.plan.outputs.escalation_status == 'will_apply'
      && github.event_name != 'workflow_call'
    environment:
      name: test-tenant
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Encode the requested escalation
        run: |
          json="$(jq -n -c \
            --arg kind   "${{ inputs.escalate_kind }}" \
            --arg rule   "${{ inputs.escalate_rule }}" \
            --arg site   "${{ inputs.escalate_site }}" \
            --arg effect "${{ inputs.escalate_effect }}" \
            '[{kind:$kind, rule:$rule, site:$site, effect:$effect}]')"
          echo "TF_VAR_runtime_rule_effects_escalations=${json}" >> "$GITHUB_ENV"

      - name: Terraform init
        run: terraform init -input=false

      # Environment approval doesn't re-run the plan's checks. Re-reads live
      # state and refuses before any write.
      - name: Preflight — refuse an escalation that cannot succeed
        env:
          TF_VAR_runtime_rule_effects_apply: ${{ inputs.confirm }}
        run: |
          terraform plan -input=false -no-color ${TF_TARGETS} -out=tfplan >/dev/null
          terraform show -json tfplan > preflight.json

          # ⚠️ Same -target pruning as the plan job (site 2, run 32523578068:
          # the guard meant to protect the write blocked a valid one). Read
          # resource_changes first, fall back to the output only if complete.
          escalates="$(jq -r '[.resource_changes[]?
                       | select(.address | test("null_resource\\.escalate"))
                       | select(.change.actions != ["no-op"])] | length' preflight.json)"

          out="$(jq -r '.planned_values.outputs.runtime_rule_effects_escalation_status.value // ""' preflight.json)"

          if [ "$escalates" -gt 0 ]; then
            status="will_apply"
          elif [ -n "$out" ] && [ "$out" != "null" ]; then
            status="$out"
          else
            status="no_write_planned"
          fi

          if [ "$status" != "will_apply" ]; then
            echo "::error::Escalation status is '$status', not 'will_apply'. Nothing was changed."
            jq -r '.planned_values.outputs.runtime_rule_effects_escalation_detail.value // "No detail available (output pruned by -target)."' preflight.json
            exit 1
          fi

          echo "Preflight: the plan still contains $escalates escalation write(s)."

          want_kind='${{ inputs.escalate_kind }}'
          want_rule='${{ inputs.escalate_rule }}'
          want_site='${{ inputs.escalate_site }}'

          match="$(jq -r --arg k "$want_kind" --arg r "$want_rule" --arg s "$want_site" '
            [ .planned_values.outputs.runtime_rule_effects_alerting_sites.value[]?
              | select(.kind == $k and .rule == $r and .site == $s) ] | length' preflight.json)"

          if [ "$match" = "0" ]; then
            echo "::error::($want_kind) rule '$want_rule' site '$want_site' is no longer an alerting site."
            echo "It may have been renamed, deleted, or already escalated. Nothing was changed."
            echo "Current candidates:"
            jq -r '.planned_values.outputs.runtime_rule_effects_alerting_sites.value[]?
                   | "  \(.kind) | \(.rule) | \(.site)"' preflight.json
            exit 1
          fi

          echo "Preflight OK — the target is still an alerting site."

      - name: Terraform apply
        env:
          TF_VAR_runtime_rule_effects_apply: ${{ inputs.confirm }}
        run: terraform apply -input=false -no-color -auto-approve ${TF_TARGETS}

      - name: Summary
        if: always()
        run: |
          {
            echo "## Escalation applied"
            echo
            echo "| field | value |"
            echo "|---|---|"
            echo "| kind | ${{ inputs.escalate_kind }} |"
            echo "| rule | ${{ inputs.escalate_rule }} |"
            echo "| site | \`${{ inputs.escalate_site }}\` |"
            echo "| effect | ${{ inputs.escalate_effect }} |"
            echo
            echo "This rule will keep appearing in workflow 8. Effect controls"
            echo "enforcement, not telemetry — a blocked action still records an"
            echo "incident by design."
          } >> "$GITHUB_STEP_SUMMARY"

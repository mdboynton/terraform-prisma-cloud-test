name: 6. Alert Summary (read-only)

# Open alert counts by severity for a CSPM Collection. Read-only: data blocks only.
#
# COUNTS from the provider data source (limit=1, server-side total, no payload).
# DETAIL (optional) from a separate REST script - critical rendered here, rest to the artifact.
#
# Docs: .github/workflows/alert-summary/README.md
#
# Required repository secrets:
#   PRISMACLOUD_API_URL, PRISMACLOUD_USERNAME, PRISMACLOUD_PASSWORD

on:
  workflow_dispatch:
    inputs:
      collection_name:
        description: "CSPM Collection name, exactly as it appears in the console"
        type: string
        required: true
      alert_status:
        description: "Which alerts to count"
        type: choice
        default: open
        options:
          - open
          - resolved
          - dismissed
          - snoozed
      time_amount:
        description: "Lookback window size (paired with the unit below)"
        type: string
        default: "30"
      time_unit:
        description: "Lookback window unit"
        type: choice
        default: day
        options:
          - hour
          - day
          - week
          - month
          - year
      include_detail:
        description: "Also list individual alerts (policy, resource, region). Critical alerts are shown on this page; the rest go to the downloadable JSON."
        type: boolean
        default: true
      detail_severities:
        description: "Which severities to pull detail for. Only 'critical' is rendered in the summary - the others appear in the JSON artifact only."
        type: choice
        default: critical
        options:
          - critical
          - critical,high
          - critical,high,medium
          - critical,high,medium,low
          - critical,high,medium,low,informational
      detail_limit:
        description: "Max alert detail rows to fetch (bounds runtime and artifact size). Counts are never capped by this."
        type: choice
        default: "500"
        options:
          - "100"
          - "500"
          - "1000"
          - "2500"
          - "5000"

concurrency:
  group: alert-summary-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TF_VERSION: "1.13.3"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

  TF_VAR_prisma_cloud_api_url: ${{ secrets.PRISMACLOUD_API_URL }}
  TF_VAR_prisma_cloud_access_key: ${{ secrets.PRISMACLOUD_USERNAME }}
  TF_VAR_prisma_cloud_secret_key: ${{ secrets.PRISMACLOUD_PASSWORD }}

  TF_VAR_alert_summary_enabled: "true"
  TF_VAR_alert_summary_collection_name: ${{ inputs.collection_name }}
  TF_VAR_alert_summary_status: ${{ inputs.alert_status }}
  TF_VAR_alert_summary_time_amount: ${{ inputs.time_amount }}
  TF_VAR_alert_summary_time_unit: ${{ inputs.time_unit }}

  TF_VAR_alert_summary_include_detail: ${{ inputs.include_detail }}
  TF_VAR_alert_summary_detail_limit: ${{ inputs.detail_limit }}

  TF_VAR_access_audit_enabled: "false"
  TF_VAR_tenant_inventory_enabled: "false"
  TF_VAR_compute_runtime_list_enabled: "false"

defaults:
  run:
    working-directory: terraform

jobs:
  summary:
    name: Count alerts for a collection
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        run: terraform init -input=false

      - name: Build severity list
        run: |
          json=$(printf '%s' "${{ inputs.detail_severities }}" \
            | jq -Rc 'split(",") | map(select(length > 0))')
          echo "TF_VAR_alert_summary_detail_severities=$json" >> "$GITHUB_ENV"
          echo "Detail severities: $json"

      - name: Read alert counts
        id: plan
        run: |
          set -o pipefail
          terraform plan -input=false -no-color \
            -target=module.alert_summary -out=tfplan 2>&1 | tee plan-output.txt

      - name: Render report
        run: |
          plan_json="$(terraform show -json tfplan)"

          get() { printf '%s' "$plan_json" | jq -c --arg k "$1" '.output_changes[$k].after'; }

          status="$(get alert_summary_status | jq -r .)"
          detail="$(get alert_summary_status_detail | jq -r '. // ""')"
          summary="$(get alert_summary)"
          scope="$(get alert_summary_scope)"

          detail_status="$(get alert_summary_detail_status | jq -r '. // "not_requested"')"
          detail_json="$(get alert_summary_detail)"

          DETAIL_TABLE_MAX=50

          # Branch on status, not exit code - check-block warnings don't fail the plan.
          if [ "$status" != "ok" ]; then
            {
              echo "## Alert summary - no counts produced"
              echo
              echo "**Collection:** \`${{ inputs.collection_name }}\`"
              echo
              echo "**Status:** \`$status\`"
              echo
              echo "> $detail"
              echo
              echo "No alert counts were produced. **Do not read the tenant-wide total as this collection's number.**"
            } >> "$GITHUB_STEP_SUMMARY"

            touch handled-failure.marker

            echo "::error title=Alert summary failed::$status - $detail"
            exit 1
          fi

          total=$(printf '%s' "$summary"  | jq -r '.total')
          tenant=$(printf '%s' "$summary" | jq -r '.tenant_total')
          accts=$(printf '%s' "$summary"  | jq -r '.account_count')
          suspect=$(printf '%s' "$summary" | jq -r '.suspect_unfiltered')

          pct=$(awk -v t="$total" -v n="$tenant" 'BEGIN { if (n > 0) printf "%.1f", (t / n) * 100; else print "0.0" }')

          {
            echo "## Alert summary"
            echo
            echo "**Collection:** \`${{ inputs.collection_name }}\` · **Status:** \`${{ inputs.alert_status }}\` · **Window:** ${{ inputs.time_amount }} ${{ inputs.time_unit }}"
            echo
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| **Alerts in this collection** | **$total** |"
            echo "| Tenant-wide (same window) | $tenant |"
            echo "| Share of tenant | ${pct}% |"
            echo "| Cloud accounts in scope | $accts |"
            echo
            echo "### By severity"
            echo
            echo "| Severity | Count |"
            echo "|---|---|"
            # Fixed order (critical first) - jq `.` inside sort_by/select is the
            # array, not the element, so index(.key) breaks; bind $s/$k first.
            printf '%s' "$summary" | jq -r '
              . as $s
              | ["critical","high","medium","low","informational"][]
              | select($s.by_severity[.] != null)
              | "| \(.) | \($s.by_severity[.]) |"'

            printf '%s' "$summary" | jq -r '
              ["critical","high","medium","low","informational"] as $k
              | .by_severity
              | to_entries[]
              | select(.key | IN($k[]) | not)
              | "| \(.key) (unexpected) | \(.value) |"'
            echo

            if [ "$suspect" = "true" ]; then
              echo "> **Warning:** this count exactly equals the tenant-wide total."
              echo "> The alerts API silently ignores unrecognised filters, so the"
              echo "> scope may not have applied. Legitimate only if this collection"
              echo "> covers every account that has alerts."
              echo
            fi

            # Only critical is rendered here; everything fetched lands in the artifact.
            if [ "$detail_status" = "ok" ]; then
              crit_total=$(printf '%s' "$detail_json" | jq -r '[.rows[] | select(.severity == "critical")] | length')

              echo "### Critical alerts"
              echo
              if [ "$crit_total" -eq 0 ]; then
                echo "None in scope."
              else
                shown=$crit_total
                [ "$shown" -gt "$DETAIL_TABLE_MAX" ] && shown=$DETAIL_TABLE_MAX

                echo "| Policy | Resource | Type | Account | Region |"
                echo "|---|---|---|---|---|"
                printf '%s' "$detail_json" | jq -r --argjson n "$shown" '
                  [.rows[] | select(.severity == "critical")][:$n][]
                  | "| \(.policy // "-" | if length > 70 then .[0:67] + "..." else . end) | \(.resource // "-") | \(.type // "-") | \(.account // "-") | \(.region // "-") |"'
                echo

                if [ "$crit_total" -gt "$shown" ]; then
                  echo "_Showing $shown of $crit_total critical alerts. The rest are in the \`alert-summary\` artifact._"
                  echo
                fi
              fi

              other=$(printf '%s' "$detail_json" | jq -r '[.by_severity | to_entries[] | select(.key != "critical") | "\(.key): \(.value)"] | join(", ")')
              if [ -n "$other" ]; then
                echo "_Also fetched (in the JSON artifact only): $other._"
                echo
              fi

              if [ "$(printf '%s' "$detail_json" | jq -r '.truncated')" = "true" ]; then
                fetched=$(printf '%s' "$detail_json" | jq -r '.fetched')
                matching=$(printf '%s' "$detail_json" | jq -r '.total_matching')
                reason=$(printf '%s' "$detail_json" | jq -r '.stop_reason // "unknown"')

                if [ "$reason" = "cap" ]; then
                  echo "> **Detail was capped.** Fetched $fetched of $matching matching alerts (detail_limit)."
                  echo "> Raise \`detail_limit\` to see more."
                else
                  echo "> **Detail is incomplete and this was NOT the cap.** Fetched $fetched of"
                  echo "> $matching matching alerts, stopped early: \`$reason\`."
                  echo "> Likely rate limiting or the API ending pagination early. Re-run to get the rest."
                fi
                echo "> The counts above are unaffected - they come from the server, not from this list."
                echo
              fi
            elif [ "$detail_status" = "missing_credentials" ]; then
              echo "### Alert detail"
              echo
              echo "> Detail was requested but credentials were incomplete, so **nothing was fetched**."
              echo "> This is not the same as there being no alerts."
              echo
            fi

            echo "<details><summary>Scope actually queried</summary>"
            echo
            echo '```json'
            printf '%s' "$scope" | jq .
            echo '```'
            echo
            echo "</details>"
            echo
            if [ "$detail_status" = "not_requested" ]; then
              echo "_Counts only. Re-run with **include_detail** to list the individual alerts._"
            else
              echo "_Full alert detail for every fetched severity is in the **alert-summary** artifact below._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$suspect" = "true" ]; then
            echo "::warning title=Count may be unfiltered::Scoped total ($total) equals the tenant-wide total ($tenant). Verify the collection's scope."
          fi

          echo "===== summary ====="
          printf '%s' "$summary" | jq .
          echo "===== scope ====="
          printf '%s' "$scope" | jq .

          printf '%s' "$plan_json" | jq '{
            status:        .output_changes.alert_summary_status.after,
            status_detail: .output_changes.alert_summary_status_detail.after,
            summary:       .output_changes.alert_summary.after,
            scope:         .output_changes.alert_summary_scope.after,
            detail_status: .output_changes.alert_summary_detail_status.after,
            detail:        .output_changes.alert_summary_detail.after
          }' > alert-summary.json

          echo "===== artifact ====="
          echo "bytes=$(wc -c < alert-summary.json) detail_rows=$(jq '.detail.fetched // 0' alert-summary.json)"

      - name: Report failure
        if: failure()
        run: |
          if [ -f handled-failure.marker ]; then
            echo "Failure already reported on the summary page."
            exit 0
          fi

          {
            echo "## Alert summary - run failed"
            echo
            echo "**Collection:** \`${{ inputs.collection_name }}\`"
            echo
            echo "No alert counts were produced. **Do not read any number in this"
            echo "run as this collection's alert count.**"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -f plan-output.txt ] && grep -q "Error:" plan-output.txt; then
            {
              echo "### What went wrong"
              echo
              echo '```'
              grep -m1 -A8 "Error:" plan-output.txt
              echo '```'
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "The failure happened before or outside the Terraform plan."
              echo "See the job log for details."
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          {
            echo "### Common causes"
            echo
            echo "| Symptom | Fix |"
            echo "|---|---|"
            echo "| \`Invalid value for variable\` | An input is out of range - check the lookback window and detail limit. |"
            echo "| \`No CSPM Collection named ...\` | The name must match the console exactly, including case and spaces. |"
            echo "| Authentication errors | The \`PRISMACLOUD_*\` repository secrets may be missing or expired. |"
            echo "| Timed out | The tenant may be rate limiting. Re-run, or lower \`detail_limit\`. |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: alert-summary
          path: terraform/alert-summary.json
          if-no-files-found: error
          retention-days: 30

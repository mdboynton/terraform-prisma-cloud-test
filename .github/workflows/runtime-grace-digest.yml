name: 8. Runtime Grace Digest

# "Which runtime rules are STILL FIRING?" - grouped by rule, workload scope,
# cloud account, with occurrence counts. Reports RECURRENCE, not age: a runtime
# incident is an event, not a resolvable state - "older than N days" trends to
# everything ever recorded (measured 14,398 of 14,410). A fixed workload stops
# firing, so recurrence clears itself.
#
# READ-ONLY on the tenant: module has data blocks only. Workflow 9 is the
# gated writer, fully decoupled.
#
# ⚠️ CAN SEND EMAIL - the one irreversible thing here. `send` job needs
# `send_warnings`, never runs on schedule, sits behind an environment approval.
# Every message goes to a single override recipient. See README "Sending".
#
# Docs: .github/workflows/runtime-grace-digest/README.md
#
# Required repository secrets:
#   PRISMACLOUD_API_URL, PRISMACLOUD_USERNAME, PRISMACLOUD_PASSWORD
#   SMTP_SERVER, SMTP_PORT, SMTP_USERNAME, SMTP_PASSWORD, SMTP_FROM (send only)

on:
  workflow_dispatch:
    inputs:
      window_days:
        # Long options exist because a backlog can exceed 180d - measured 0
        # open in 14d, 111 in all-time.
        description: "Recurrence window. A rule that produced an incident inside this many days is 'still firing'."
        type: choice
        default: "14"
        options:
          - "7"
          - "14"
          - "30"
          - "90"
          - "180"
          - "365"
          - "730"
          - "1825"
      alert_status:
        description: "Which lifecycle state to report on. 'open' is the normal digest; 'dismissed' reviews what teams have accepted."
        type: choice
        default: "open"
        options:
          - "open"
          - "dismissed"
          - "resolved"
          - "snoozed"
      max_alerts:
        description: "Cap on alerts fetched for grouping. Window and tenant TOTALS are never capped by this."
        type: choice
        default: "2000"
        options:
          - "500"
          - "2000"
          - "5000"
          - "10000"
      severities:
        # `policy.severity` FAILS OPEN - unrecognised value returns HTTP 200 and
        # EVERY severity. Choice only. Comma-joined form absent: silently
        # ignored server-side; see digest.sh for the repeated-object form.
        description: "Restrict to alerts promoted by a policy of this severity. 'all severities' is the default and applies NO filter."
        type: choice
        default: "all severities"
        options:
          - "all severities"
          - "high + critical"
          - "critical only"
          - "high only"
      plan_warnings:
        description: "Also PLAN the grace warning: who would be told a rule is heading for escalation. Planning alone sends nothing - sending needs send_warnings as well."
        type: boolean
        default: false
      grace_days:
        description: "Days an alert may stay open before its rule becomes an escalation candidate. Only used when plan_warnings is on."
        type: choice
        default: "14"
        options:
          - "7"
          - "14"
          - "30"
          - "60"
          - "90"
      campaign_start_date:
        description: "REQUIRED with plan_warnings (YYYY-MM-DD). The date the campaign was announced. Countdowns run from max(firstSeen, this), so findings already open before the campaign still get a full grace period instead of reading as long overdue."
        type: string
        default: ""
      send_warnings:
        # Only switch in this repo that contacts a human - a sent email can't
        # be recalled. Off by default (also on schedule). Requires
        # plan_warnings + environment approval + re-check post-approval (see `send` job).
        description: "ACTUALLY SEND the grace warning emails. Requires plan_warnings. Every message goes to the fixed override recipient, never to the real owners. Off by default and never on for scheduled runs."
        type: boolean
        default: false

  # Daily, not weekly: reminder days (1,3,5,7,10,13) are exact and a weekly
  # cron only ever lands on two of them. Daily != mailing daily - most days the
  # plan is a no-op (age-based). 08:00 UTC.
  #schedule:
  #  - cron: "0 8 * * *"

concurrency:
  group: runtime-grace-digest-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TF_VERSION: "1.13.3"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

  TF_VAR_prisma_cloud_api_url: ${{ secrets.PRISMACLOUD_API_URL }}
  TF_VAR_prisma_cloud_access_key: ${{ secrets.PRISMACLOUD_USERNAME }}
  TF_VAR_prisma_cloud_secret_key: ${{ secrets.PRISMACLOUD_PASSWORD }}

  TF_VAR_runtime_grace_digest_enabled: "true"

  # `inputs.*` is empty on a scheduled run, so every input needs a fallback or
  # the schedule would pass "" and fail variable validation.
  TF_VAR_runtime_grace_digest_window_days: ${{ inputs.window_days || '14' }}
  TF_VAR_runtime_grace_digest_alert_status: ${{ inputs.alert_status || 'open' }}
  TF_VAR_runtime_grace_digest_max_alerts: ${{ inputs.max_alerts || '2000' }}

  # list(string) TF_VAR needs a JSON literal; "Resolve severity filter" step
  # below translates the dropdown label. Default [] (no filter) - the
  # reference tenant promotes everything as `high`, so a narrower default
  # would be invisible here and only bite tenants with custom promoting policies.

  # plan_warnings off on schedule: `campaign_start_date` has no default (today
  # would restart every countdown; a fixed past date ambushes owners), so a
  # scheduled run reports no_campaign_start and computes nothing. To put the
  # campaign on the cron, the start date needs to become a committed repo
  # variable - a campaign decision, not a workflow tweak.
  TF_VAR_runtime_grace_digest_notify_enabled: ${{ inputs.plan_warnings || 'false' }}
  TF_VAR_runtime_grace_digest_grace_days: ${{ inputs.grace_days || '14' }}

  # Reminder days left at module default [1,3,5,7,10,13] - a campaign property,
  # not a per-run input.

  # No fallback: empty leaves the module in no_campaign_start rather than
  # silently picking a clock.
  TF_VAR_runtime_grace_digest_campaign_start_date: ${{ inputs.campaign_start_date }}

  # Every planned warning is addressed here, always. Module has no send path
  # at all (no SMTP client) - exists so addressing can be reviewed before send exists.
  TF_VAR_runtime_grace_digest_warning_recipient: "tule@paloaltonetworks.com"

  TF_VAR_alert_summary_enabled: "false"
  TF_VAR_compute_alert_summary_enabled: "false"
  TF_VAR_access_audit_enabled: "false"
  TF_VAR_tenant_inventory_enabled: "false"
  TF_VAR_compute_runtime_list_enabled: "false"

defaults:
  run:
    working-directory: terraform

jobs:
  digest:
    name: Report runtime rules still firing
    runs-on: ubuntu-latest

    timeout-minutes: 20

    outputs:
      emails_today: ${{ steps.sendgate.outputs.emails_today }}
      should_send:  ${{ steps.sendgate.outputs.should_send }}
      # Day-14 groups escalatable; drives escalation-plan's call into workflow 9.
      esc_ready:    ${{ steps.sendgate.outputs.esc_ready }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        run: terraform init -input=false

      - name: Resolve severity filter
        # `*)` arm -> [] on a scheduled run (inputs.severities is empty) - no
        # filter, the whole population.
        env:
          SEVERITY_CHOICE: ${{ inputs.severities }}
        run: |
          case "$SEVERITY_CHOICE" in
            "high + critical") sev='["high","critical"]' ;;
            "critical only")   sev='["critical"]' ;;
            "high only")       sev='["high"]' ;;
            *)                 sev='[]' ;;
          esac
          echo "TF_VAR_runtime_grace_digest_severities=$sev" >> "$GITHUB_ENV"
          echo "Severity filter: ${SEVERITY_CHOICE:-all severities} -> $sev"

      - name: Read runtime incident recurrence
        id: plan
        run: |
          set -o pipefail
          terraform plan -input=false -no-color \
            -target=module.runtime_grace_digest -out=tfplan 2>&1 | tee plan-output.txt

      - name: Render report
        # No ${{ }} interpolation in the body - a crafted input could execute.
        env:
          WARNING_RECIPIENT: ${{ env.TF_VAR_runtime_grace_digest_warning_recipient }}
        run: |
          # Reads the PLAN file, not state: state is empty on a plan-only run,
          # so `terraform output` would return nothing.
          plan_json="$(terraform show -json tfplan)"

          get() { printf '%s' "$plan_json" | jq -c --arg k "$1" '.output_changes[$k].after'; }

          status="$(get runtime_grace_digest_status | jq -r .)"
          detail="$(get runtime_grace_digest_status_detail | jq -r '. // ""')"
          summary="$(get runtime_grace_digest)"
          rules="$(get runtime_grace_digest_rules)"

          notify_status="$(get runtime_grace_digest_notify_status | jq -r '. // "disabled"')"
          notify_detail="$(get runtime_grace_digest_notify_status_detail | jq -r '. // ""')"
          warning_plan="$(get runtime_grace_digest_warning_plan)"
          warning_msgs="$(get runtime_grace_digest_warning_messages)"

          # BRANCH ON status, NOT ON THE EXIT CODE.
          #
          # The module's `check` blocks emit warnings but do NOT fail the plan,
          # and `terraform show -json` omits the `checks` array from a plan file
          # entirely — so a warning is invisible to any caller trusting the exit
          # code. Both behaviours verified against the live tenant.
          #
          # `missing_credentials` and `disabled` mean we never looked. Rendering
          # "no rules firing" for those would imply good news, which is a lie.
          if [ "$status" = "disabled" ] || [ "$status" = "missing_credentials" ]; then
            {
              echo "## Runtime grace digest — no report produced"
              echo
              echo "**Status:** \`$status\`"
              echo
              echo "> $detail"
              echo
              echo "**Do not read this as \"nothing is firing\".** Nothing was checked."
            } >> "$GITHUB_STEP_SUMMARY"

            touch handled-failure.marker

            echo "::error title=Runtime grace digest failed::$status - $detail"
            exit 1
          fi

          in_window=$(printf   '%s' "$summary" | jq -r '.alerts_in_window')
          all_time=$(printf    '%s' "$summary" | jq -r '.alerts_all_time')
          fetched=$(printf     '%s' "$summary" | jq -r '.alerts_fetched')
          complete=$(printf    '%s' "$summary" | jq -r '.complete')
          distinct=$(printf    '%s' "$summary" | jq -r '.distinct_rules')
          groups=$(printf      '%s' "$summary" | jq -r '.distinct_groups')
          occurrences=$(printf '%s' "$summary" | jq -r '.occurrences')
          unnamed=$(printf     '%s' "$summary" | jq -r '.unnamed_rule_alerts')

          window_days=$(printf   '%s' "$summary" | jq -r '.window_days')
          status_filter=$(printf '%s' "$summary" | jq -r '.alert_status')

          sev_list=$(printf '%s' "$summary" | jq -r '(.severities // []) | join(", ")')
          if [ -z "$sev_list" ]; then
            severity_filter="all severities"
          else
            severity_filter="$sev_list"
          fi

          rule_count=$(printf '%s' "$rules" | jq -r 'length')

          # Capped fetch -> grouped numbers describe the sample, not the
          # tenant; warning must come before the table.
          if [ "$complete" != "true" ]; then
            {
              echo "## Runtime grace digest"
              echo
              echo "> [!WARNING]"
              echo "> **Partial result — the rule numbers below are from a sample.**"
              echo "> Only **$fetched of $in_window** alerts in the window were read"
              echo "> (capped by \`max_alerts\`). Rules below the cut-off are missing"
              echo "> ENTIRELY, so a rule absent here may still be firing."
              echo "> Re-run with a higher \`max_alerts\` for a complete picture."
            } >> "$GITHUB_STEP_SUMMARY"
            sampled=" (sampled)"
          else
            echo "## Runtime grace digest" >> "$GITHUB_STEP_SUMMARY"
            sampled=""
          fi

          {
            echo
            echo "**Window:** last ${window_days} days · **Status filter:** \`${status_filter}\` · **Severity:** \`${severity_filter}\`"
            echo
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| **Rules still firing**$sampled | **$distinct** |"
            echo "| Rule/account groups$sampled | $groups |"
            echo "| Total occurrences$sampled | $occurrences |"
            echo "| Incidents in window (tenant total) | $in_window |"
            echo "| Tenant-wide, all time | $all_time |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$rule_count" -eq 0 ]; then
            {
              echo
              echo "> **No named runtime rule produced an incident in this window.**"
              echo "> That is the desired state — but confirm the window is right before"
              echo "> reporting it as good news."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo
              echo "### Rules still producing incidents"
              echo
              echo "Ordered by occurrences. A rule high on this list has an unaddressed"
              echo "condition — the workload keeps doing the thing the rule detects."
              echo
              echo "| Occurrences | Rule | Scope | Cloud account | Detected |"
              echo "|---:|---|---|---|---|"
              printf '%s' "$rules" | jq -r '
                .[:40][]
                | "| \(.occurrences) | `\(.rule)` | \(.scope) | \(.account) | \(.categories) |"
              '
            } >> "$GITHUB_STEP_SUMMARY"

            if [ "$rule_count" -gt 40 ]; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "_Showing the top 40 of $rule_count rule/account groups. The artifact has all of them._" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

          if [ "$unnamed" -gt 0 ]; then
            {
              echo
              echo "> **$unnamed incident(s) came from the built-in runtime model**, not a named rule."
              echo "> Those are excluded from the table because there is no named rule to act on."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # The grace warning PLAN. Nothing is sent. Owner addresses are NOT
          # printed here (summary page is repo-wide readable) - counts only.
          if [ "$notify_status" != "disabled" ]; then
            {
              echo
              echo "## Grace warning — planned, not sent"
              echo
            } >> "$GITHUB_STEP_SUMMARY"

            if [ "$warning_plan" = "null" ] || [ -z "$warning_plan" ]; then
              {
                echo "> [!NOTE]"
                echo "> No warning plan was produced."
                [ -n "$notify_detail" ] && echo "> $notify_detail"
              } >> "$GITHUB_STEP_SUMMARY"
            else
              w_grace=$(printf   '%s' "$warning_plan" | jq -r '.grace_days')
              w_planned=$(printf '%s' "$warning_plan" | jq -r '.planned')
              w_overdue=$(printf '%s' "$warning_plan" | jq -r '.overdue')
              w_unroute=$(printf '%s' "$warning_plan" | jq -r '.unroutable')
              w_notesc=$(printf  '%s' "$warning_plan" | jq -r '.not_escalatable')
              w_send=$(printf    '%s' "$warning_plan" | jq -r '.sendable')
              w_people=$(printf  '%s' "$warning_plan" | jq -r '.distinct_owners')
              w_maxrcpt=$(printf '%s' "$warning_plan" | jq -r '.max_recipients')
              w_ndays=$(printf   '%s' "$warning_plan" | jq -r '.notify_days | join(", ")')
              w_due=$(printf     '%s' "$warning_plan" | jq -r '.due_today')
              w_duerout=$(printf '%s' "$warning_plan" | jq -r '.due_today_routable')
              w_emails=$(printf  '%s' "$warning_plan" | jq -r '.emails_today')
              w_perrule=$(printf '%s' "$warning_plan" | jq -r '.sends_if_per_rule')
              w_acctunr=$(printf '%s' "$warning_plan" | jq -r '.accounts_unroutable')

              {
                echo "> [!IMPORTANT]"
                echo "> **Planning sends nothing.** The module has no SMTP client,"
                echo "> webhook or mail command; mail leaves only from the separate"
                echo "> gated \`send\` job, which needs \`send_warnings\`, a manual"
                echo "> dispatch and an environment approval. Every message is"
                echo "> addressed to a single override recipient, and the real owner"
                echo "> addresses are recorded for review only."
                echo
                echo "**Grace window:** ${w_grace} days · **Reminders on day:** ${w_ndays}"
                echo
                echo "| Metric | Value |"
                echo "|---|---|"
                echo "| Rule groups with an open alert | $w_planned |"
                echo "| **Due a reminder TODAY** | **$w_due** |"
                echo "| ...of those, actually addressable | $w_duerout |"
                echo "| **Emails that would be sent** | **$w_emails** |"
                echo "| (one per rule group would have been) | $w_perrule |"
                echo "| Accounts due with no owner to tell | $w_acctunr |"
                echo "| Past the grace window | $w_overdue |"
                echo "| No owner on the alert (unroutable) | $w_unroute |"
                echo "| Not escalatable (built-in model) | $w_notesc |"
                echo "| **Could honestly be warned today** | **$w_send** |"
                echo "| Distinct people who would be contacted | $w_people |"
                echo "| Most recipients on a single group | $w_maxrcpt |"
              } >> "$GITHUB_STEP_SUMMARY"

              if [ "$w_due" -gt "$w_duerout" ]; then
                {
                  echo
                  echo "> [!WARNING]"
                  echo "> **$(( w_due - w_duerout )) of $w_due groups due a reminder today have nobody to send it to.**"
                  echo "> Their countdown continues regardless. Unless a fallback"
                  echo "> recipient is declared, those rules reach the deadline with"
                  echo "> no warning having been given."
                } >> "$GITHUB_STEP_SUMMARY"
              fi

              # DAY 14 handoff to workflow 9. ⚠️ Reads plan outputs, NOT the
              # artifact (written later in this same step; a missing file
              # under `bash -e` would abort the whole render). List, not a
              # button: escalation targets an EFFECT SITE and zero effect keys
              # survive alert promotion (measured, 100 alerts) - filling
              # `site` automatically would pick a control at random.
              esc_handoff="$(printf '%s' "$plan_json" | jq -c '(.output_changes.runtime_grace_digest_escalation_handoff.after   // [])')"
              esc_blocked="$(printf '%s' "$plan_json" | jq -c '(.output_changes.runtime_grace_digest_escalation_blocked.after   // [])')"
              esc_ambigl="$(printf '%s' "$plan_json" | jq -c '(.output_changes.runtime_grace_digest_escalation_ambiguous.after // [])')"

              esc_ready="$(jq -r 'length' <<<"$esc_handoff")"
              esc_block="$(jq -r 'length' <<<"$esc_blocked")"
              esc_ambig="$(jq -r 'length' <<<"$esc_ambigl")"

              if [ "$(( esc_ready + esc_block + esc_ambig ))" -gt 0 ]; then
                {
                  echo
                  echo "## Day 14 — reached the deadline"
                  echo
                  echo "These rule groups have used their full ${w_grace}-day grace period."
                  echo "**Nothing has been escalated.** If anything below is escalatable,"
                  echo "this run calls workflow 9 in its READ-ONLY mode to enumerate the"
                  echo "candidate effect sites. Applying one is still a human action:"
                  echo "workflow 9's apply path needs a manual dispatch, a site chosen by"
                  echo "hand, the word APPLY typed in, and an environment approval."
                } >> "$GITHUB_STEP_SUMMARY"

                if [ "$esc_ready" -gt 0 ]; then
                  {
                    echo
                    echo "### Ready for workflow 9 ($esc_ready)"
                    echo
                    echo "| Policy | Rule | Oldest | Accounts | Occurrences |"
                    echo "|---|---|---|---|---|"
                    jq -r '.[]
                      | "| \(.kind) | \(.rule) | \(.max_age_days)d | \(.accounts | join(", ")) | \(.occurrences) |"' \
                      <<<"$esc_handoff"
                    echo
                    echo "> [!IMPORTANT]"
                    echo "> **You must choose the effect site.** Run **9. Runtime Rule"
                    echo "> Effects** with \`escalate_kind\` and \`escalate_rule\` copied from"
                    echo "> the table, leaving the escalate fields blank for a read-only"
                    echo "> plan first — that plan lists the rule's effect sites and their"
                    echo "> current settings. A container rule has 27 of them and a host"
                    echo "> rule 19; the alert data identifies none, so picking one is a"
                    echo "> decision about what starts blocking traffic, not a lookup."
                  } >> "$GITHUB_STEP_SUMMARY"
                fi

                # Reported even though nothing can be done about them through
                # this route. On the reference tenant `default` carries 51 of
                # 111 incidents, so a day-14 section that listed only the
                # actionable rules would present less than half the expired
                # backlog as the whole of it.
                if [ "$esc_block" -gt 0 ]; then
                  {
                    echo
                    echo "### Overdue but NOT escalatable ($esc_block)"
                    echo
                    echo "> [!WARNING]"
                    echo "> These have passed the deadline and workflow 9 **cannot act on"
                    echo "> them**. They are the built-in learned model, which has no rule"
                    echo "> name to target. Their findings are real; the escalation route"
                    echo "> is not available. They need a different remedy."
                    echo
                    jq -r '.[]
                      | "- **\(.rule)** (\(.kind)), oldest \(.max_age_days)d — \(.reason)"' \
                      <<<"$esc_blocked"
                  } >> "$GITHUB_STEP_SUMMARY"
                fi

                if [ "$esc_ambig" -gt 0 ]; then
                  {
                    echo
                    echo "### Overdue, policy undetermined ($esc_ambig)"
                    echo
                    echo "> [!WARNING]"
                    echo "> The owning policy could not be determined from the alert, and it"
                    echo "> is **not guessed**: three rule names exist in both the container"
                    echo "> and host policies, and escalating the wrong one would change an"
                    echo "> unrelated control. Confirm the policy in the Compute Console"
                    echo "> before escalating."
                    echo
                    jq -r '.[]
                      | "- **\(.rule)** (scope reported as `\(.kind)`), oldest \(.max_age_days)d"' \
                      <<<"$esc_ambigl"
                  } >> "$GITHUB_STEP_SUMMARY"
                fi
              fi

              if [ "$notify_status" = "all_overdue" ]; then
                {
                  echo
                  echo "> [!WARNING]"
                  echo "> **Every planned warning is already past the deadline.**"
                  echo "> $notify_detail"
                  echo ">"
                  echo "> Set a campaign start date and measure the grace period from"
                  echo "> FIRST CONTACT before wiring any send path. Sending this as-is"
                  echo "> would not be a warning."
                } >> "$GITHUB_STEP_SUMMARY"
              fi

              if [ "$w_unroute" -gt 0 ]; then
                {
                  echo
                  echo "> [!WARNING]"
                  echo "> **$w_unroute of $w_planned groups cannot be addressed to anyone.**"
                  echo "> The alert carries no owner. They are reported here rather than"
                  echo "> dropped: escalating those rules would block a workload with"
                  echo "> nobody warned. A fallback recipient needs to be declared."
                } >> "$GITHUB_STEP_SUMMARY"
              fi

              if [ "$w_notesc" -gt 0 ]; then
                {
                  echo
                  echo "> **$w_notesc group(s) point at the built-in runtime model**, which"
                  echo "> cannot be escalated by name. Warning about those would threaten a"
                  echo "> consequence that cannot be carried out, so they are excluded from"
                  echo "> the sendable count."
                } >> "$GITHUB_STEP_SUMMARY"
              fi

              msg_count=$(printf '%s' "$warning_msgs" | jq -r 'length')
              if [ "$msg_count" -gt 0 ]; then
                {
                  echo
                  echo "### Age of the oldest open alert per rule"
                  echo
                  echo "| Age (days) | Rule | Scope | Cloud account | Open | Escalatable | Routable |"
                  echo "|---:|---|---|---|---:|---|---|"
                  printf '%s' "$warning_msgs" | jq -r '
                    .[:40][]
                    | "| \(.age_days) | `\(.rule)` | \(.scope) | \(.account) | \(.open_alerts) | \(if .escalatable then "yes" else "no" end) | \(if .routable then "yes" else "**no**" end) |"
                  '
                } >> "$GITHUB_STEP_SUMMARY"

                if [ "$msg_count" -gt 40 ]; then
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  echo "_Showing the 40 oldest of $msg_count. The artifact has all of them, with recipients, plus the per-account rollup that a send path would use._" >> "$GITHUB_STEP_SUMMARY"
                fi
              fi
            fi
          fi

          if [ "$status" = "suspect_unfiltered" ]; then
            {
              echo
              echo "> [!WARNING]"
              echo "> **The window may not have applied.**"
              echo "> $detail"
              echo "> Confirm before treating this as a recurrence signal."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$status" = "empty_window" ]; then
            {
              echo
              echo "> [!WARNING]"
              echo "> **Nothing fired inside the window - but the tenant is not empty.**"
              echo "> $detail"
              echo "> This report is empty because of the window, not because"
              echo "> the tenant is clean. A grace campaign run on this setting"
              echo "> would warn nobody. Widen \`window_days\` to cover the"
              echo "> population workflow 9 escalates against."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          {
            echo
            echo "<details><summary>Why this reports recurrence, not \"unresolved for N days\"</summary>"
            echo
            echo "A runtime finding is an **event**, not a state. It happened, and no API"
            echo "call makes it un-happen — there is no \"resolved\" to age against, and"
            echo "incidents never expire from the store. So \"older than N days\" selects"
            echo "almost everything ever recorded and really only measures whether someone"
            echo "clicked acknowledge."
            echo
            echo "\"Still firing\" is the answerable question: a fixed workload stops"
            echo "producing incidents, so the signal clears itself."
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

          # `// null`: distinguishes "planning disabled" from "planned, found
          # nobody" - the artifact is the reviewable record of addressing, not
          # a subset of it.
          printf '%s' "$plan_json" | jq '{
            summary: .output_changes.runtime_grace_digest.after,
            scope:   .output_changes.runtime_grace_digest_scope.after,
            rules:   .output_changes.runtime_grace_digest_rules.after,

            notify_status:        (.output_changes.runtime_grace_digest_notify_status.after        // null),
            notify_status_detail: (.output_changes.runtime_grace_digest_notify_status_detail.after // null),
            warning_plan:         (.output_changes.runtime_grace_digest_warning_plan.after         // null),

            # Per RULE GROUP - carries would_notify (real owner mailboxes).
            warning_messages: (.output_changes.runtime_grace_digest_warning_messages.after // null),

            # Per ACCOUNT - one entry per email, the unit a send path iterates.
            warning_accounts: (.output_changes.runtime_grace_digest_warning_accounts.after // null),

            # Day-14 handoff. site/effect null on every entry by design (see
            # module). Three lists: actionable / un-escalatable / ambiguous.
            escalation_handoff:   (.output_changes.runtime_grace_digest_escalation_handoff.after   // null),
            escalation_blocked:   (.output_changes.runtime_grace_digest_escalation_blocked.after   // null),
            escalation_ambiguous: (.output_changes.runtime_grace_digest_escalation_ambiguous.after // null)
          }' > runtime-grace-digest.json

          # Addressing invariant, re-checked on the actual artifact bytes -
          # not inferred from the module having been correct upstream. Fails
          # the run (a warning on a scheduled job is read by nobody). Unset
          # expected address is itself the error - refuses to compare against "".
          if [ -z "${WARNING_RECIPIENT:-}" ]; then
            echo "::error title=Cannot verify addressing::WARNING_RECIPIENT is empty, so the override recipient cannot be checked. Refusing to produce a send-path artifact that has not been verified."
            touch handled-failure.marker
            exit 1
          fi

          bad_rcpt="$(jq -r --arg p "$WARNING_RECIPIENT" '
            [ (.warning_accounts // [])[], (.warning_messages // [])[]
              | select(.recipient != $p) | .recipient ]
            | unique | join(", ")' runtime-grace-digest.json)"
          if [ -n "$bad_rcpt" ]; then
            echo "::error title=Addressing invariant violated::The plan contains recipients other than the override: $bad_rcpt"
            touch handled-failure.marker
            {
              echo
              echo "> [!CAUTION]"
              echo "> **The warning plan addressed somebody other than the override recipient.**"
              echo "> The run was failed deliberately and nothing was written for a send path."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "===== artifact ====="
          echo "bytes=$(wc -c < runtime-grace-digest.json | tr -d ' ')"

      # 4 ANDed conditions: event=dispatch (schedule never sends), input
      # requested, warnings planned, emails_today>0. Environment approval is a
      # 5th; re-verification in `send` is a 6th.
      - name: Decide whether to send
        id: sendgate
        env:
          SEND_REQUESTED: ${{ inputs.send_warnings }}
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          emails_today="$(jq -r '.warning_plan.emails_today // 0' runtime-grace-digest.json)"
          notify_status="$(jq -r '.notify_status // "disabled"' runtime-grace-digest.json)"

          # emails_today==0 has 3 causes the zero alone can't distinguish:
          # (a) no plan at all - warning_plan null, no_campaign_start
          # (b) nothing due - due_today==0, genuinely quiet
          # (c) due but unsendable - due_today>0, no owner address to send to.
          # (c) especially must not read as (b), the exact silent
          # delivery gap this campaign exists to prevent.
          # ------------------------------------------------------------------
          due_today="$(jq -r '.warning_plan.due_today // 0' runtime-grace-digest.json)"
          acct_unroutable="$(jq -r '.warning_plan.accounts_unroutable // 0' runtime-grace-digest.json)"
          notify_detail="$(jq -r '.notify_status_detail // ""' runtime-grace-digest.json)"
          plan_present="$(jq -r 'if (.warning_plan // null) == null then "no" else "yes" end' runtime-grace-digest.json)"

          # How many groups have reached day 14 AND are escalatable. This
          # decides whether the escalation-plan job calls workflow 9.
          #
          # ⚠️ READ HERE, NOT IN THE RENDER STEP. This step runs AFTER the
          # artifact is written (~line 838); the render step runs BEFORE it.
          # A previous version of the day-14 code read this file from the
          # render step and, because `run:` executes under `bash -e`, the
          # missing file aborted the whole step. Reading it here is safe;
          # moving this line earlier would not be.
          esc_ready="$(jq -r '(.escalation_handoff // []) | length' runtime-grace-digest.json)"

          should_send=false
          if [ "$IS_DISPATCH" = "true" ] \
             && [ "$SEND_REQUESTED" = "true" ] \
             && [ "$notify_status" != "disabled" ] \
             && [ "$emails_today" -gt 0 ]; then
            should_send=true
          fi

          echo "emails_today=$emails_today" >> "$GITHUB_OUTPUT"
          echo "should_send=$should_send"   >> "$GITHUB_OUTPUT"
          echo "esc_ready=$esc_ready"       >> "$GITHUB_OUTPUT"
          # The console line carries the DISCRIMINATING numbers, not just the
          # zero. Reading `emails_today=0` off the log and having to open the
          # artifact to learn why is how a diagnosis turns into a guess.
          echo "should_send=$should_send emails_today=$emails_today" \
               "due_today=$due_today accounts_unroutable=$acct_unroutable" \
               "notify_status=$notify_status plan=$plan_present" \
               "esc_ready=$esc_ready"

          {
            echo
            echo "### Sending"
            echo
            if [ "$should_send" = "true" ]; then
              echo "**$emails_today email(s) queued** - one per account, every one addressed"
              echo "to the override recipient. The send job is now waiting on the"
              echo "\`grace-warning-send\` environment approval."
            elif [ "$SEND_REQUESTED" != "true" ]; then
              echo "Nothing was sent. This run only reported."
            elif [ "$notify_status" = "disabled" ]; then
              echo "> [!WARNING]"
              echo "> Sending was requested but \`plan_warnings\` was off, so there is no"
              echo "> plan to send. Nothing will be sent - re-run with both switched on."
            elif [ "$plan_present" != "yes" ]; then
              echo "> [!WARNING]"
              echo "> Sending was requested, but **no warning plan was produced**, so there"
              echo "> is nothing to send. Status: \`$notify_status\`."
              [ -n "$notify_detail" ] && echo ">"
              [ -n "$notify_detail" ] && echo "> $notify_detail"
              echo ">"
              echo "> This is **not** the same as \"nothing is due\" - nothing was"
              echo "> evaluated. The most common cause is an empty"
              echo "> \`campaign_start_date\`, which leaves the countdown with no day 0."
            elif [ "$emails_today" -eq 0 ] && [ "$due_today" -gt 0 ]; then
              echo "> [!WARNING]"
              echo "> **$due_today rule group(s) are due a reminder today, but no email can"
              echo "> be sent.** The $acct_unroutable account(s) they roll up into carry no"
              echo "> owner address, so there is nobody to tell."
              echo ">"
              echo "> Their countdown continues regardless. This is a **delivery gap**, not"
              echo "> a quiet day - these are the findings that reach the deadline with no"
              echo "> warning having been given."
            elif [ "$emails_today" -eq 0 ]; then
              echo "Sending was requested, but **nothing is due today**: no group's age"
              echo "lands on a reminder day (\`age_days\` matched none of the reminder"
              echo "days). Nothing will be sent."
              echo
              echo "Day 0 is \`max(firstSeen, campaign_start_date)\`, so the reminder day a"
              echo "group lands on is set by whichever is LATER. To reach day 3, set"
              echo "\`campaign_start_date\` to 3 days before today (UTC)."
            else
              echo "Nothing was sent."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report failure
        if: failure()
        run: |
          if [ -f handled-failure.marker ]; then
            echo "Failure already reported on the summary page."
            exit 0
          fi

          {
            echo "## Runtime grace digest — run failed"
            echo
            echo "No report was produced. **Do not read this run as \"nothing is firing\".**"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -f plan-output.txt ] && grep -q "Error:" plan-output.txt; then
            {
              echo "### What went wrong"
              echo

              script_msg="$(grep -m1 '^Error Message:' plan-output.txt || true)"
              if [ -n "$script_msg" ]; then
                echo "**${script_msg#Error Message: }**"
                echo
              fi

              echo '```'
              grep -m1 -A8 "Error:" plan-output.txt
              echo '```'
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "The failure happened before or outside the Terraform plan."
              echo "See the job log for details."
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          {
            echo "### Common causes"
            echo
            echo "| Symptom | Fix |"
            echo "|---|---|"
            echo "| \`authentication returned no token\` | The \`PRISMACLOUD_*\` repository secrets may be missing or expired. |"
            echo "| \`Invalid value for variable\` | An input is out of range — window_days is 1–3650, max_alerts is 1–10000. |"
            echo "| Timed out | Lower \`max_alerts\`, or re-run if the tenant is rate limiting. |"
            echo "| Looking for CSPM alert counts? | Wrong workflow — use workflow 6. This one reports runtime rule recurrence. |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-grace-digest
          path: terraform/runtime-grace-digest.json
          if-no-files-found: error
          retention-days: 90

  # Only job in this repo that contacts a human. Separate job, not step:
  # `environment:` gates a JOB, not a step. Gates 1-4 are ANDed in sendgate
  # above; 5 is the environment approval; 6 is the re-verification below
  # (approving an environment does not re-run the plan job's checks).
  send:
    name: Send the grace warnings (gated)
    needs: digest
    runs-on: ubuntu-latest
    if: needs.digest.outputs.should_send == 'true'
    environment:
      name: grace-warning-send
    timeout-minutes: 15

    # Overrides workflow-level working-directory: terraform - this job runs no
    # Terraform, and download-artifact unpacks to the workspace root anyway.
    defaults:
      run:
        working-directory: .

    steps:
      - name: Download the reviewed plan
        uses: actions/download-artifact@v4
        with:
          name: runtime-grace-digest

      # Re-verification after approval: re-asserted on the bytes that actually
      # arrived post-round-trip, not assumed from the digest job's earlier check.
      - name: Verify the addressing before sending
        env:
          WARNING_RECIPIENT: ${{ env.TF_VAR_runtime_grace_digest_warning_recipient }}
        run: |
          if [ -z "${WARNING_RECIPIENT:-}" ]; then
            echo "::error title=Refusing to send::WARNING_RECIPIENT is empty, so recipients cannot be verified."
            exit 1
          fi

          bad="$(jq -r --arg p "$WARNING_RECIPIENT" '
            [ (.warning_accounts // [])[] | select(.recipient != $p) | .recipient ]
            | unique | join(", ")' runtime-grace-digest.json)"
          if [ -n "$bad" ]; then
            echo "::error title=Refusing to send::Artifact contains non-override recipients: $bad"
            exit 1
          fi

          n="$(jq -r '[.warning_accounts[]? | select(.routable)] | length' runtime-grace-digest.json)"
          [ "$n" -gt 0 ] || { echo "::error::Nothing routable to send."; exit 1; }

          echo "Verified: $n message(s), all addressed to $WARNING_RECIPIENT"

      # Bodies to disk, not the matrix - keeps real owner addresses out of
      # workflow expressions (echoed into logs).
      - name: Compose the messages
        run: |
          mkdir -p outbox
          jq -r '.warning_accounts[] | select(.routable) | @base64' \
            runtime-grace-digest.json | nl -w1 -s' ' | while read -r i row; do
            printf '%s' "$row" | base64 --decode > "outbox/$i.json"
          done
          echo "composed $(ls outbox | wc -l | tr -d ' ') message(s)"

      - name: Send
        env:
          SMTP_SERVER:   ${{ secrets.SMTP_SERVER }}
          SMTP_PORT:     ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM:     ${{ secrets.SMTP_FROM }}
          WARNING_RECIPIENT: ${{ env.TF_VAR_runtime_grace_digest_warning_recipient }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # What actually went, appended only after the sender returns 0. The
          # report step reads THIS, not outbox/.
          : > sent.log

          for f in outbox/*.json; do
            account=$(jq -r '.account' "$f")
            days=$(jq -r '.min_days_remaining' "$f")
            rules=$(jq -r '.rule_count' "$f")

            intended=$(jq -r '.would_notify | join(", ")' "$f")

            subject="[Action needed] $account: $rules runtime rule(s), $days day(s) before enforcement"

            {
              echo "This is a grace-period reminder from the runtime rule campaign."
              echo
              echo "Cloud account: $account"
              echo "Days remaining before the rule(s) are switched to blocking: $days"
              echo
              echo "Rules still producing incidents in this account:"
              jq -r '.groups[] | "  - \(.rule) [\(.scope)] - age \(.age_days)d, \(.days_remaining)d left, \(.open_alerts) open"' "$f"
              echo
              echo "What to do: fix the workload behaviour these rules detect, or reply"
              echo "to request an exception. When a workload stops triggering a rule the"
              echo "finding clears itself."
              echo
              echo "-----"
              echo "TEST MODE: in production this would be addressed to: $intended"
              echo "Sent to $WARNING_RECIPIENT instead. Run: $RUN_URL"
            } > body.txt

            python3 - "$subject" body.txt <<'PY'
          import os, smtplib, ssl, sys
          from email.message import EmailMessage

          subject, body_path = sys.argv[1], sys.argv[2]
          msg = EmailMessage()
          msg["Subject"] = subject
          msg["From"] = os.environ["SMTP_FROM"]
          # Only place a recipient is set - the override, never would_notify.
          msg["To"] = os.environ["WARNING_RECIPIENT"]
          msg.set_content(open(body_path).read())

          host = os.environ["SMTP_SERVER"]
          port = int(os.environ.get("SMTP_PORT") or 587)
          ctx = ssl.create_default_context()

          # 465=implicit TLS (SMTP_SSL); 587=STARTTLS. Port 25 absent -
          # GitHub runners block outbound 25.
          if port == 465:
              conn = smtplib.SMTP_SSL(host, port, timeout=30, context=ctx)
          else:
              conn = smtplib.SMTP(host, port, timeout=30)

          with conn as s:
              if port != 465:
                  s.starttls(context=ctx)
              s.login(os.environ["SMTP_USERNAME"], os.environ["SMTP_PASSWORD"])
              s.send_message(msg)
          print(f"sent: {subject}")
          PY

            jq -r '"\(.account)\t\(.min_days_remaining)\t\(.rule_count)"' "$f" >> sent.log
          done

      - name: Report what was sent
        if: always()
        run: |
          # Reads sent.log (delivered), not outbox/ (composed) - a run that
          # dies mid-send must not report undelivered messages as sent.
          planned=$(ls outbox/*.json 2>/dev/null | wc -l | tr -d ' ')
          sent=$(wc -l < sent.log 2>/dev/null | tr -d ' '); sent=${sent:-0}

          {
            echo "## Grace warnings — sent"
            echo
            if [ "$sent" -eq 0 ]; then
              echo "**No messages were sent.** $planned were composed."
            else
              echo "**$sent of $planned** composed message(s) were sent."
            fi
            echo

            if [ "$sent" -gt 0 ]; then
              echo "| Account | Days left | Rules |"
              echo "|---|---:|---:|"
              while IFS="$(printf '\t')" read -r acct days rules; do
                echo "| $acct | $days | $rules |"
              done < sent.log
              echo
            fi

            if [ "$sent" -lt "$planned" ]; then
              echo "> [!WARNING]"
              echo "> $((planned - sent)) message(s) were NOT sent — the send step stopped"
              echo "> early. The accounts above are the ones that DID receive mail; the"
              echo "> rest received nothing. Re-running re-sends to everyone, including"
              echo "> the accounts listed above."
              echo
            fi

            echo "All messages were addressed to the override recipient. The real owner"
            echo "addresses appear in each body for review and were not used as recipients."
          } >> "$GITHUB_STEP_SUMMARY"

  # Day 14 -> workflow 9 (read-only). Calls workflow 9's read-only mode so
  # candidate effect sites are enumerated for a human, instead of relying on
  # someone noticing the digest. ⚠️ Does not escalate anything - workflow_call
  # declares no escalate_*/confirm inputs, and its apply job refuses
  # workflow_call events (asserted, .testtmp/test_wf9_callable.sh). Keeping
  # the flip human-gated: plans/policy-escalation-findings.md.
  escalation_gate:
    name: Check for a pending escalation approval
    needs: digest
    runs-on: ubuntu-latest
    if: needs.digest.outputs.esc_ready != '' && needs.digest.outputs.esc_ready != '0'
    # ⚠️ No checkout - must not inherit workflow-level working-directory:
    # terraform, or bash can't even start ("No such file or directory").
    defaults:
      run:
        working-directory: .
    permissions:
      contents: read
      actions: read # to read OTHER workflows' run states
    outputs:
      proceed: ${{ steps.pending.outputs.proceed }}
      waiting: ${{ steps.pending.outputs.waiting }}
    steps:
      - name: Look for a workflow 9 run already awaiting approval
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fails open, deliberately: a query failure proceeds with the
          # read-only plan rather than skipping. Suppressing a duplicate
          # REPORT, not a write, so the safe default is the informative one.
          waiting="$(gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/runtime-rule-effects.yml/runs?status=waiting&per_page=1" \
            --jq '.total_count' 2>/dev/null || echo "query_failed")"

          if [ "$waiting" = "query_failed" ]; then
            echo "::warning::Could not check for pending workflow 9 approvals; continuing with the read-only plan."
            waiting=0
          fi

          proceed=true
          [ "$waiting" -gt 0 ] && proceed=false

          echo "waiting=$waiting"   >> "$GITHUB_OUTPUT"
          echo "proceed=$proceed"   >> "$GITHUB_OUTPUT"
          echo "workflow 9 runs awaiting approval: $waiting -> proceed=$proceed"

          if [ "$proceed" = "false" ]; then
            {
              echo
              echo "## Escalation plan skipped"
              echo
              echo "$waiting workflow 9 run(s) are already waiting on an approval."
              echo "Someone has been asked this question and has not answered yet, so"
              echo "this run did not queue another plan behind it."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  escalation_plan:
    name: Enumerate escalation targets (read-only)
    needs: [digest, escalation_gate]
    if: needs.escalation_gate.outputs.proceed == 'true'
    uses: ./.github/workflows/runtime-rule-effects.yml
    secrets: inherit
    with:
      # Match the digest's own window - workflow 9's 14d default returns
      # nothing on this tenant (backlog older than 6 months).
      window_days: ${{ inputs.window_days || '14' }}
      alert_status: "open"
